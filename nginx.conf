server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Served on a non-standard host port (5000) behind the k3d LB: emit relative
    # redirects so the trailing-slash 301 (/en/api -> /en/api/) keeps the browser's
    # origin (scheme + :5000) instead of rebuilding an absolute URL from the Host
    # header, which drops the port.
    absolute_redirect off;

    # Astro's `build.format: "directory"` writes en/api/index.html for /en/api.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Astro fingerprints everything under /_astro/, so it can be cached for good.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
