server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve on a non-standard host port (5000) behind k3d LB: emit RELATIVE
    # redirects so the trailing-slash 301 (/quickstart -> /quickstart/) keeps the
    # browser's origin (scheme + :5000) instead of rebuilding an absolute URL
    # from the Host header (which drops the port).
    absolute_redirect off;

    # Mintlify export uses clean-URL folders (introduction/index.html) + root
    # index.html and absolute /_next assets. Serve at root of this port.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache the immutable Next.js asset bundles.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
