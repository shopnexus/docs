# Local preview of the exported docs site (nginx), same as production.
#   docker compose up --build   →  http://localhost:5000
# For authoring with hot-reload use the Mintlify dev server instead:
#   cd docs && npx mint@latest dev
name: docs
services:
  docs:
    build: .
    ports:
      - "5000:80"
    restart: unless-stopped
