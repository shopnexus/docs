name: Build & Push docs image

# Builds the Mintlify site (mint export) into an nginx static image and pushes
# to GHCR. Deployment is GitOps (Argo CD in the umbrella repo).
#
# `spec-updated` is sent by the server repo's build workflow so the API reference
# follows the backend's OpenAPI spec, which this build fetches (see below).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/shopnexus/docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Fetched here, not in the Dockerfile: a RUN curl layer is cached by
      # instruction text, so the spec would freeze at whatever the first build saw.
      # As a COPYed file its layer invalidates on content change.
      - name: Fetch OpenAPI spec from the server repo
        run: |
          curl -fsSL https://raw.githubusercontent.com/shopnexus/server/main/api/openapi.gen.yaml \
            -o docs/api/openapi.yaml
          grep -q '^openapi: ' docs/api/openapi.yaml
          echo "spec: $(wc -c < docs/api/openapi.yaml) bytes, base $(grep -A2 '^servers:' docs/api/openapi.yaml | grep url:)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
