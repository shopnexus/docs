name: Build & Push docs image

# Builds the Mintlify site (mint export) into an nginx static image and pushes
# to GHCR. Deployment is GitOps (Argo CD in the umbrella repo).
#
# `spec-updated` is sent by the server repo's build workflow so the API reference
# follows the backend's OpenAPI spec, which this build fetches (see below).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/shopnexus/docs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Fetched here, not in the Dockerfile: a RUN curl layer is cached by
      # instruction text, so the spec would freeze at whatever the first build saw.
      # As a COPYed file its layer invalidates on content change.
      #
      # Pinned to the sha the server dispatched, falling back to `main` for a build this
      # repo started itself. Fetching `main` on a dispatch would race a CDN:
      # raw.githubusercontent serves a branch ref with `cache-control: max-age=300`, and
      # the dispatch lands seconds after the server's push, so that URL can still return
      # the previous spec for minutes. This build would then publish the old file and
      # nothing would trigger another — stale, and looking exactly like success. A sha URL
      # is immutable content, so it is always the spec that fired the event.
      - name: Fetch OpenAPI spec from the server repo
        env:
          REF: ${{ github.event.client_payload.sha || 'main' }}
        run: |
          echo "fetching spec at server ref: $REF"
          curl -fsSL "https://raw.githubusercontent.com/shopnexus/server/$REF/api/openapi.gen.yaml" \
            -o docs/api/openapi.yaml
          grep -q '^openapi: ' docs/api/openapi.yaml
          # Assert the base path survived the trip. This is the field that broke silently
          # before — the reference kept advertising `url: /` after the gateway moved to
          # /api/v1 — and an API reference whose base URL is wrong is worse than one that
          # fails to render, because every example in it is quietly unusable.
          base=$(grep -A2 '^servers:' docs/api/openapi.yaml | grep -m1 'url:' | sed 's/.*url: *//')
          test -n "$base" || { echo "::error::spec has no servers[0].url"; exit 1; }
          echo "spec: $(wc -c < docs/api/openapi.yaml) bytes, base '$base', ref $REF"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
