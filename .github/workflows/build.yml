name: Build image

# A push to main builds the image once and tags it :main and :sha-<commit>.
# Argo CD Image Updater deploys :main to dev by digest. Prod runs what a
# release of the umbrella names: its release.yml adds the tag X.Y.Z to the
# sha-<commit> image of the commit the umbrella points at, so prod runs the
# digest dev ran. cleanup then keeps :main, every X.Y.Z and the 10 newest
# other builds, so a release can name any of the last 10 commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Lint and types; build waits for it.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check

  build:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deletes the builds no one can deploy any more. exclude-tags keeps :main
  # and the releases' X.Y.Z; keep-n-tagged keeps the 10 newest sha-<commit>
  # builds; untagged and half-deleted images go.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          exclude-tags: '^main$|^[0-9]+\.[0-9]+\.[0-9]+$'
          use-regex: true
          keep-n-tagged: 10
          delete-untagged: true
          delete-partial-images: true
