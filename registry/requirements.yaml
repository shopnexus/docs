    main:
      1: Một bên chọn hủy đơn.
      2: Hệ thống hủy đơn, ghi bên hủy và lý do.
      3: Chốt giá bị bỏ, thương lượng quay lại đang thương lượng.
    alt:
      A1: { at: 1, text: "Người bán không gửi hàng trong thời hạn: hệ thống tự hủy đơn." }
      A2: { at: 1, text: "Hãng không lấy hàng trong thời hạn: hệ thống tự hủy đơn." }
      A3: { at: 1, text: "Người bán gửi tin cho người mua khác, hoặc ẩn, xóa tin: các đơn chờ gửi trên tin tự hủy.", br: BR-DEAL-04 }
    exc:
      E1: { at: 1, text: Đơn đã gửi hàng, error: move_not_allowed }
    gaps:
      - "BR-DEAL-07 cho hủy cả đơn đã tạo vận đơn khi hãng chưa lấy hàng (kèm hủy vận đơn trên hãng); code chỉ cho người dùng hủy đơn chưa gửi, đơn đã gửi chỉ bị hủy khi hết hạn chờ lấy hàng (A2)."

