      2: "Trợ lý AI đọc tin, ảnh giống nhau, giá tham khảo, các cuộc trò chuyện bị báo và lịch sử tài khoản bằng các công cụ chỉ đọc, rồi ghi bằng chứng và một đề xuất (ẩn tin, tạm khóa, nhắn người mua)."
      3: "Điều phối viên mở ca, xem bằng chứng và đề xuất, tick hoặc bỏ tick từng dòng."
      4: "Điều phối viên bấm làm theo; trang điều hành gọi các thao tác của mình, mỗi thao tác một dòng nhật ký."
      5: "Khối đề xuất chuyển thành đã làm, ghi người làm và thời điểm, kèm Hoàn tác."
    alt:
      A1: { at: 3, text: "Điều phối viên nhắn để trợ lý AI sửa đề xuất; trợ lý AI trả lời bằng bản kế tiếp, bản cũ thu gọn." }
      A2: { at: 3, text: "Điều phối viên chọn Không vi phạm; ca đóng, không thao tác nào trên tài khoản." }
      A3: { at: 5, text: "Điều phối viên bấm Hoàn tác; hệ thống làm ngược từng thao tác, bỏ qua thao tác đã đổi từ trước, tin đã gửi cho người mua giữ nguyên." }
      A4: { at: 2, text: "Ca liên quan một nhóm tài khoản: trợ lý AI vẽ đồ thị liên kết và đề xuất cho cả nhóm." }
    notes: "Trợ lý AI không có quyền ghi; một chỉ dẫn lẫn trong tin nhắn của người dùng chỉ có thể làm sai đề xuất. Hôm nay ca báo cáo đã có (UC-MOD-02) và trợ lý AI đã đọc được ca khi được hỏi (UC-MOD-08); phần đọc ở nền, khối đề xuất, làm theo và hoàn tác chưa làm."
