  - id: UC-TRS-01
    was: [UC-19]
    status: done
    title: { vi: "Đánh giá người cùng giao dịch và trả lời đánh giá", en: "Review the other side and reply to a review" }
    short: { vi: "Đánh giá hai chiều" }
    actors: [buyer, seller]
    fr: [FR-TRS-01]
    br: [BR-TRS-04, BR-MOD-02]
    nfr: [NFR-IDEM-01, NFR-CONC-01]
    api: ["PUT /v1/orders/{order_id}/review", "DELETE /v1/orders/{order_id}/review", "POST /v1/reviews/{id}/reply"]
    pre: Đã đăng nhập; người dùng là người mua hoặc người bán của một đơn đã hoàn tất hoặc giao không thành mà không phải do hãng làm thất lạc hàng.
    post: "Đánh giá được lưu và hiện khi bên kia cũng đánh giá hoặc 7 ngày sau khi đơn đóng; người được đánh giá trả lời được một lần."
    main:
      1: "Người dùng chọn 1–5 sao, viết vài dòng, chọn thẻ theo vai của bên kia và thêm tối đa 4 ảnh."
      2: Hệ thống kiểm tra người dùng là một bên của đơn và đơn đã hoàn tất hoặc giao không thành, không phải do hãng làm thất lạc hàng.
      3: "Hệ thống lưu đánh giá. Đánh giá hiện ngay nếu bên kia đã đánh giá, khi đó cả hai cùng hiện; nếu không, đánh giá ẩn tới 7 ngày sau khi đơn đóng."
      4: Khi đánh giá đã hiện, người được đánh giá trả lời một lần; đánh giá khóa lại.
    alt:
      A1: { at: 3, text: "Khi đánh giá còn ẩn và chưa quá 7 ngày từ lần gửi đầu, người viết sửa, xóa rồi đăng lại." }
      A2: { at: 1, text: "Ứng dụng gửi lại đúng đánh giá, lần xóa hoặc câu trả lời đã lưu: hệ thống trả lại kết quả đã có.", nfr: NFR-IDEM-01 }
    exc:
      E1: { at: 1, text: Tài khoản đang bị tạm khóa, br: BR-MOD-02, error: account_suspended }
      E2: { at: 1, text: "Số sao, nội dung, thẻ hoặc câu trả lời sai quy tắc", br: BR-TRS-04, error: invalid_review }
      E3: { at: 1, text: Ảnh không phải ảnh người dùng tải lên, error: invalid_upload }
      E4: { at: 2, text: Người dùng không phải một bên của đơn, error: order_not_found }
      E5: { at: 2, text: "Đơn chưa hoàn tất hoặc giao không thành, hoặc giao không thành vì hãng làm thất lạc hàng (UC-DEAL-05 E4)", error: order_not_delivered }
      E6: { at: 3, text: Sửa hoặc xóa khi đánh giá đã hiện hoặc đã quá 7 ngày từ lần gửi đầu, br: BR-TRS-04, error: review_locked }
      E7: { at: 3, text: Sửa hoặc xóa khi người được đánh giá đã trả lời, error: review_closed }
      E8: { at: 3, text: Xóa khi chưa có đánh giá, error: review_not_found }
      E9: { at: 3, text: "Hai lần ghi cùng lúc trên một đánh giá: lần sau nhận try_again và đọc lại", nfr: NFR-CONC-01 }
      E10: { at: 4, text: Đánh giá còn ẩn, error: review_hidden }
      E11: { at: 4, text: Đánh giá đã có câu trả lời, error: review_replied }
      E12: { at: 4, text: "Người trả lời không phải người được đánh giá, hoặc đánh giá đã bị xóa", error: review_not_found }
