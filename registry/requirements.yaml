  - id: UC-DSC-01
    was: [UC-09]
    status: untraced
    title: { vi: "Tìm kiếm bằng câu tự nhiên với AI", en: "Natural-language search with AI" }
    actors: [buyer, guest]
    secondary: [llm]
    br: [BR-DSC-01]
    pre: Không bắt buộc đăng nhập.
    post: Người dùng nhận danh sách tin, chip điều kiện tắt được và một câu diễn giải. Không dữ liệu nghiệp vụ nào bị thay đổi.
    main:
      1: Người dùng gõ một câu nhu cầu, hoặc chọn một ảnh để tìm món giống.
      2: "Hệ thống gửi câu cho mô hình ngôn ngữ một lần; mô hình đổi câu thành các điều kiện ưu tiên: cụm từ, danh mục, giá, tình trạng, nơi bán, độ gần, độ mới. Điều kiện không khớp dữ liệu thật (danh mục, tỉnh, xã) bị bỏ."
      3: Hệ thống tìm trên các tin đang bán theo ba cách (khớp từ khóa, theo nghĩa của câu, theo ảnh) rồi hợp nhất thứ hạng; câu gốc luôn được giữ làm một cụm từ tìm.
      4: Hệ thống trả tin, chip và câu diễn giải; cách đọc câu được lưu 7 ngày cho lần tìm sau.
      5: Người dùng tắt một chip; hệ thống tìm lại bằng cách đọc đã lưu, không hỏi lại mô hình.
    alt:
      A1: { at: 2, text: "Mô hình lỗi hoặc quá 4 giây: hệ thống tìm bằng nguyên câu gốc, không có chip." }
      A2: { at: 4, text: "Không có tin phù hợp: trả kết quả rỗng kèm chip để người dùng nới điều kiện." }
      A3: { at: 4, text: "Người dùng theo dõi câu tìm: hệ thống quét tin mới mỗi 30 phút và báo số tin mới khớp (UC-DSC-03)." }
    notes: Tin đang giữ chỗ, đã bán, đang ẩn, đã xóa hoặc của người đã chặn mình (theo cả hai chiều) không có trong kết quả.
