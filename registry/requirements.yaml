  # ---- MOD ----
  - id: UC-MOD-01
    was: [UC-23]
    status: done
    title: { vi: "Báo cáo vi phạm (hàng cấm, hàng giả, lừa đảo, khác)", en: "Report a violation" }
    short: { vi: "Báo cáo vi phạm" }
    actors: [user]
    fr: [FR-MOD-01]
    br: [BR-MOD-01, BR-MOD-02]
    api: ["GET /v1/reports", "POST /v1/reports", "DELETE /v1/reports/{id}"]
    pre: "Đã đăng nhập."
    post: "Người dùng có một báo cáo đang mở về tin hoặc tài khoản; báo cáo vào ca của tài khoản bị báo (UC-MOD-02)."
    main:
      1: "Người dùng chọn báo cáo một tin đăng hoặc một tài khoản."
      2: "Người dùng chọn lý do (hàng cấm, hàng giả, lừa đảo, khác) và ghi chú ngắn tùy chọn, tối đa 500 ký tự."
      3: "Hệ thống ghi báo cáo về tài khoản bị báo; báo cáo một tin thì tài khoản bị báo là người bán của tin."
      4: "Người dùng xem các báo cáo của mình, mỗi báo cáo đang mở, đã xử lý hoặc đã rút."
    alt:
      A1: { at: 2, text: "Báo cáo một tài khoản có thể kèm cuộc trò chuyện của người báo với tài khoản đó, kể cả sau khi đã chặn, để nhân viên đọc." }
      A2: { at: 3, text: "Người dùng đã có báo cáo đang mở về cùng đối tượng: hệ thống thay lý do, ghi chú và cuộc trò chuyện, không mở báo cáo mới." }
      A3: { at: 4, text: "Người dùng rút báo cáo; báo cáo giữ lại ở trạng thái đã rút và lần báo sau mở báo cáo mới." }
      A4: { at: 1, text: "Tin đang ẩn, đang giữ chỗ, đã bán hoặc bị từ chối vẫn báo cáo được." }
    exc:
      E1: { at: 1, text: "Tài khoản đang bị tạm khóa", br: BR-MOD-02, error: account_suspended }
      E2: { at: 1, text: "Báo cáo chính mình hoặc tin của mình", error: self_report }
      E3: { at: 2, text: "Báo cáo sai quy tắc: không đúng một đối tượng, lý do lạ, ghi chú quá dài hoặc cuộc trò chuyện không phải của hai người", error: invalid_report }
      E4: { at: 1, text: "Tin đã xóa hoặc không có", error: listing_not_found }
      E5: { at: 1, text: "Tài khoản bị báo là tài khoản hệ thống ShopNexus", error: account_is_system }
      E6: { at: 4, text: "Báo cáo cần rút không phải của người dùng hoặc không có", error: report_not_found }
  - id: UC-MOD-02
    was: [UC-24]
    status: done
    title: { vi: "Xử lý báo cáo vi phạm và tạm khóa tài khoản", en: "Handle reports and suspend accounts" }
    actors: [moderator]
    fr: [FR-MOD-01]
    br: [BR-MOD-01, BR-MOD-02, BR-MOD-03]
    nfr: [NFR-IDEM-01]
    api: ["GET /v1/console/reports", "GET /v1/console/reports/{account_id}", "POST /v1/console/reports/{account_id}/dismiss", "POST /v1/console/reports/{account_id}/resolve", "POST /v1/console/reports/{account_id}/reopen", "POST /v1/console/listings/{id}/hide", "POST /v1/console/listings/{id}/unhide", "GET /v1/console/accounts", "GET /v1/console/accounts/{id}", "POST /v1/console/accounts/{id}/suspend", "POST /v1/console/accounts/{id}/unsuspend"]
    pre: "Có ít nhất một báo cáo chưa rút về một tài khoản; điều phối viên đã đăng nhập trang điều hành (UC-MOD-10)."
    post: "Ca được đóng là không vi phạm hoặc đã xử lý; mỗi thao tác có một dòng nhật ký kiểm toán (UC-SHR-02)."
    main:
      1: "Điều phối viên mở danh sách ca đang mở; mỗi ca gom mọi báo cáo chưa rút và chưa xử lý về một tài khoản, ca có báo cáo mới nhất lên đầu."
      2: "Điều phối viên mở một ca: tài khoản và lịch sử tạm khóa, các tin bị báo (tin bị báo nhiều nhất lên đầu), các báo cáo kèm ghi chú và cuộc trò chuyện người báo đính kèm."
      3: "Điều phối viên xử lý tài khoản: ẩn tin vi phạm, hoặc tạm khóa tài khoản kèm lý do và ngày hết hạn nếu chỉ tạm thời."
      4: "Điều phối viên đóng ca là đã xử lý; các báo cáo của ca được đánh dấu đã xử lý và báo cáo kế tiếp về tài khoản mở một ca mới."
    alt:
      A1: { at: 3, text: "Không vi phạm: điều phối viên đóng ca là không vi phạm, không thao tác nào trên tài khoản.", br: BR-MOD-01 }
      A2: { at: 4, text: "Điều phối viên mở lại ca đã đóng; báo cáo của ca về lại ca đang mở, trừ báo cáo mà người báo đã báo lại cùng đối tượng." }
      A3: { at: 3, text: "Điều phối viên gỡ ẩn tin hoặc gỡ tạm khóa; tạm khóa có ngày hết hạn tự hết khi tới ngày. Tin bị nhân viên ẩn thì người bán không tự hiện lại được." }
      A4: { at: 4, text: "Gửi lại thao tác đóng ca khi ca đã đóng cùng kết quả: hệ thống trả ca đó và không ghi thêm.", nfr: NFR-IDEM-01 }
      A5: { at: 2, text: "Điều phối viên hỏi trợ lý AI về tài khoản của ca (UC-MOD-08); mọi thao tác vẫn do điều phối viên bấm.", br: BR-MOD-03 }
    exc:
      E1: { at: 2, text: "Tài khoản chưa từng bị báo cáo", error: report_case_not_found }
      E2: { at: 4, text: "Tài khoản không còn ca đang mở", error: report_case_not_open }
      E3: { at: 4, text: "Không có ca đã đóng để mở lại", error: report_case_not_resolved }
      E4: { at: 3, text: "Tạm khóa không có lý do", error: suspend_reason_required }
      E5: { at: 3, text: "Ngày hết tạm khóa đã qua", error: suspend_until_in_past }
      E6: { at: 2, text: "Tài khoản là tài khoản hệ thống ShopNexus", error: account_is_system }
      E7: { at: 3, text: "Tin cần ẩn đã bị xóa", error: listing_not_found }
    notes: "Không có hình phạt tự động; tạm khóa và ẩn tin luôn do nhân viên bấm."
