  # ---- DSC ----
  - id: UC-DSC-01
    was: [UC-09]
    status: untraced
    title: { vi: "Tìm kiếm bằng ngôn ngữ tự nhiên với AI agent", en: "Natural-language search with the AI agent" }
    actors: [buyer, guest]
    secondary: [llm]
    br: [BR-DSC-01]
    pre: Không bắt buộc đăng nhập; nếu đã đăng nhập, agent đọc thêm sở thích, đơn gần đây và phường/xã của người dùng.
    post: Người dùng nhận danh sách tin, chip ràng buộc sửa được và một câu diễn giải; các ràng buộc đã chốt được nhớ trong phiên tìm kiếm. Không dữ liệu nghiệp vụ nào bị thay đổi.
    main:
      1: Người dùng gõ hoặc nói một câu nhu cầu; nếu đang trong một phiên tìm kiếm, câu mới được nối vào phiên đó.
      2: Hệ thống bắt đầu lượt tìm, nạp các ràng buộc đã chốt của phiên.
      3: "Agent lập kế hoạch và dùng các công cụ chỉ đọc: tra danh mục, xác định vị trí, đọc sở thích, tìm tin; tối đa 4 vòng. Nếu máy chủ gặp sự cố giữa chừng, lượt tìm chạy tiếp từ bước đã xong."
      4: Lệnh tìm tin luôn giữ câu gốc của người dùng cùng bộ lọc agent điền; tìm kiếm lai hợp nhất ba danh sách xếp hạng (mục 2.4) rồi xếp lại theo khoảng cách và bậc người bán.
      5: Hệ thống trả tin, chip và câu diễn giải, lưu ràng buộc vào phiên.
      6: Người dùng sửa hoặc xóa chip; hệ thống chạy lại tìm kiếm lai mà không gọi LLM.
    alt:
      A1: { at: 3, text: "Quá 8 giây hoặc một công cụ lỗi: rơi về tìm kiếm lai thuần với truy vấn gốc." }
      A2: { at: 5, text: "Không có tin phù hợp: trả kết quả rỗng kèm chip để người dùng nới ràng buộc." }
      A3: { at: 6, text: "Người dùng gửi câu tiếp theo: lặp lại từ bước 1, ràng buộc cũ được kế thừa." }
    notes: Tin đang giữ chỗ, đã bán, đang ẩn hoặc đã xóa không có trong kết quả.
