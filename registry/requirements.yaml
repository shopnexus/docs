  - id: UC-DEAL-04
    was: [UC-16]
    status: done
    title: { vi: "Tạo vận đơn GHTK/GHN để gửi hàng", en: "Ship an order with a GHTK/GHN waybill" }
    short: { vi: "Tạo đơn gửi hàng" }
    actors: [seller]
