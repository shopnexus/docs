      3: "Hệ thống tìm trên các tin đang bán theo nhiều cách (khớp từ, theo nghĩa của câu, theo hình dáng món hàng mô hình tả) rồi hợp nhất thứ hạng; câu gốc luôn là một cụm từ tìm."
      4: "Hệ thống trả một trang tin và các chip, rồi ghi câu tìm vào lịch sử của người dùng (giữ 10 câu gần nhất)."
      5: "Người dùng tắt một chip; hệ thống tìm lại bằng cách đọc đã lưu, không hỏi lại mô hình."
    alt:
      A1: { at: 2, text: "Mô hình lỗi, quá 4 giây, hoặc người dùng đã dùng hết 200 lượt đọc câu trong ngày: hệ thống tìm bằng từ của câu gốc, không có chip; các trang sau cũng tìm bằng câu gốc." }
      A2: { at: 4, text: "Không có tin phù hợp: trả trang rỗng kèm chip để người dùng nới điều kiện." }
      A3: { at: 4, text: "Người dùng đã theo dõi câu tìm này: kết quả kèm lượt theo dõi đó (UC-DSC-06)." }
      A4: { at: 1, text: "Khách gõ câu tìm: hệ thống tìm bằng từ của câu gốc, không hỏi mô hình; trang đầu kèm chip xem trước, không áp dụng, khi câu đó đã được đọc trong 7 ngày. Không ghi lịch sử." }
      A5: { at: 1, text: "Người dùng đã đăng nhập chọn một ảnh vừa tải lên: hệ thống tìm tin có ảnh giống món hàng, không có chip và không ghi lịch sử." }
      A6: { at: 1, text: "Người dùng mở lịch sử tìm: hệ thống hiện 10 câu gần nhất; người dùng xóa một câu hoặc xóa hết." }
    exc:
      E1: { at: 1, text: Tìm bằng ảnh khi chưa đăng nhập, error: unauthenticated }
      E2: { at: 1, text: Ảnh đi kèm câu tìm hoặc tin gốc, error: search_conflict }
      E3: { at: 1, text: Ảnh không phải ảnh chờ của chính người dùng, error: invalid_upload }
      E4: { at: 3, text: Không đọc được ảnh để tìm, error: search_unavailable }
      E5: { at: 1, text: "Khách tìm bằng câu quá nhiều lần (2 lượt mỗi giây, dồn tới 30)", error: rate_limited }
    notes: "Bộ lọc, vị trí và lỗi của chúng như UC-DSC-02. Tìm kiếm chỉ đọc câu, không làm gì thay người dùng (BR-DSC-01)."
  - id: UC-DSC-02
    was: [UC-10]
    status: done
    title: { vi: "Duyệt danh mục, lọc kết quả và xem tin tương tự", en: "Browse categories, filter and see similar listings" }
    actors: [buyer, guest]
    fr: [FR-DSC-02]
    br: [BR-DSC-02, BR-DSC-03]
    nfr: [NFR-PRIV-01]
    api: ["GET /v1/search", "PUT /v1/hidden/{listing_id}", "DELETE /v1/hidden/{listing_id}"]
    pre: Không cần đăng nhập; ẩn tin khỏi kết quả cần đăng nhập.
    post: Người dùng nhận một trang tin đang bán khớp bộ lọc. Không dữ liệu nghiệp vụ nào bị thay đổi.
    main:
      1: "Người dùng chọn một danh mục, hoặc mở trang tìm không có câu tìm."
      2: "Người dùng đặt bộ lọc (tỉnh, giá, tình trạng, chỉ tin nhận trả giá, người bán, khoảng cách quanh vị trí) và cách sắp xếp: mới nhất, gần nhất, giá tăng dần hoặc giá giảm dần."
      3: "Hệ thống trả các tin đang bán khớp bộ lọc theo thứ tự đã chọn, từng trang, tối đa 500 tin; có vị trí thì mỗi tin ghi khoảng cách, người đã đăng nhập thấy tin nào mình đã lưu."
    alt:
      A1: { at: 1, text: "Từ một tin đăng, người dùng xem tin tương tự: hệ thống tìm theo tiêu đề, danh mục con, khoảng giá ±30% và độ giống về chữ và ảnh của tin gốc; bỏ tin gốc và tin của chính người xem." }
      A2: { at: 3, text: "Người dùng đã đăng nhập ẩn một tin của người khác khỏi kết quả của mình: tin không còn hiện trong tìm kiếm, Trang chủ, hồ sơ người bán và lần quét tìm kiếm theo dõi; hiện lại thì tin quay về. Hệ thống giữ 1.000 tin ẩn mới nhất." }
      A3: { at: 2, text: "Lọc theo một người bán (trang người bán trên website): lượt tìm không ghi lịch sử và không gắn lượt theo dõi." }
    exc:
      E1: { at: 2, text: Sắp theo gần nhất hoặc đặt bán kính mà không có vị trí, error: position_required }
      E2: { at: 2, text: Tọa độ hoặc phường/xã không hợp lệ, error: invalid_position }
      E3: { at: 2, text: Mã tỉnh không có, error: invalid_province }
      E4: { at: 2, text: Giá thấp nhất lớn hơn giá cao nhất, error: invalid_price_range }
      E5: { at: 1, text: Tin gốc không có hoặc không còn công khai, error: listing_not_found }
      E6: { at: 3, text: Ẩn tin của chính mình, error: own_listing }
      E7: { at: 3, text: Ẩn tin không có hoặc đã xóa, error: listing_not_found }
    notes: Vị trí người tìm không được lưu hay ghi nhật ký; vị trí tin là điểm đã làm mờ hoặc tâm phường/xã (NFR-PRIV-01).
  - id: UC-DSC-03
    was: [UC-11]
    status: done
    title: { vi: "Lưu tin và nhận cảnh báo giảm giá", en: "Save listings and get price-drop alerts" }
    actors: [buyer]
    fr: [FR-DSC-03]
    br: [BR-DSC-03]
    nfr: [NFR-CONC-01]
    api: ["GET /v1/saved", "PUT /v1/saved/{listing_id}", "DELETE /v1/saved/{listing_id}", "PUT /v1/saved/{listing_id}/alert", "DELETE /v1/saved/{listing_id}/alert"]
    pre: Đã đăng nhập.
    post: "Tin được lưu kèm giá lúc lưu và một mức báo giá; người mua được báo mỗi khi giá xuống một mức thấp mới dưới mức đó."
    main:
      1: Người mua lưu một tin đang bán hoặc đang giữ chỗ của người khác; hệ thống ghi giá lúc lưu. Lưu lại lần nữa không đổi gì.
      2: "Người mua đặt mức giá muốn được báo, hoặc để mức mặc định là giá lúc lưu; đặt mức cho tin chưa lưu thì hệ thống lưu tin trước."
      3: "Khi tin được đăng hoặc sửa, hệ thống so giá hiện tại của tin đang bán với mức của từng lượt lưu; giá xuống dưới mức và thấp hơn lần báo trước thì hệ thống báo người mua."
      4: "Người mua xem danh sách tin đã lưu: tin còn bán trước, rồi tin đã bán, đang ẩn hoặc đã xóa; tin đang ẩn hoặc đã xóa chỉ hiện trạng thái."
    alt:
      A1: { status: retired, at: 1, text: "Chuyển sang UC-DSC-06 (bước 1, 2 và A1)." }
      A2: { status: retired, at: 3, text: "Chuyển sang UC-DSC-06 (bước 3 và A2)." }
      A3: { status: retired, at: 4, text: "Chuyển sang UC-DSC-06 (bước 5)." }
      A4: { status: retired, at: 3, text: "Chuyển sang UC-DSC-06 A3." }
      A5: { at: 4, text: "Người mua bỏ lưu tin, hoặc bỏ mức báo giá: tin vẫn lưu và báo theo giá lúc lưu. Bỏ theo dõi câu tìm chuyển sang UC-DSC-06 A4." }
    exc:
      E1: { at: 1, text: Tin của chính người mua, error: own_listing }
      E2: { at: 1, text: Tin không còn đang bán hoặc đang giữ chỗ, error: listing_unavailable }
      E3: { at: 1, text: Tin không có, error: listing_not_found }
      E4: { at: 1, text: Đã lưu đủ 500 tin, br: BR-DSC-03, error: saved_limit_reached }
      E5: { status: retired, at: 1, text: Chuyển sang UC-DSC-06 E1. }
      E6: { status: retired, at: 1, text: Chuyển sang UC-DSC-06 E2. }
      E7: { status: retired, at: 1, text: Chuyển sang UC-DSC-06 E3. }
      E8: { status: retired, at: 1, text: Chuyển sang UC-DSC-06 E4. }
      E9: { status: retired, at: 4, text: Chuyển sang UC-DSC-06 E5. }
      E10: { status: retired, at: 4, text: Chuyển sang UC-DSC-06 E6. }
      E11: { at: 2, text: Tin vừa bị bỏ lưu trong lúc đặt mức báo giá, nfr: NFR-CONC-01, error: try_again }
    notes: "Thông báo giảm giá đi qua module Thông báo; người mua tắt thông báo đẩy về giảm giá thì thông báo vẫn được ghi. Theo dõi một câu tìm là UC-DSC-06."
  - id: UC-DSC-04
    was: [UC-12]
    status: done
    title: { vi: "Xem hồ sơ người bán và theo dõi người bán", en: "View a seller's profile and follow the seller" }
    actors: [buyer, guest]
    fr: [FR-DSC-03, FR-DSC-04]
    br: [BR-ACC-01, BR-DSC-02]
    api: ["GET /v1/screens/seller/{id}", "GET /v1/sellers/{id}/listings", "GET /v1/sellers/{id}/reviews", "GET /v1/accounts/{id}/reviews", "POST /v1/follows", "GET /v1/follows", "DELETE /v1/follows/{account_id}"]
    pre: Không cần đăng nhập; theo dõi cần đăng nhập.
    post: Người xem thấy hồ sơ người bán. Người theo dõi được báo khi người bán đăng tin mới.
    main:
      1: "Người dùng mở hồ sơ một người bán từ tin đăng, cuộc trò chuyện hoặc đánh giá."
      2: "Hệ thống hiện tên, ảnh đại diện, giới thiệu, ngày tham gia, lần hoạt động gần nhất, điểm đánh giá khi bán và khi mua, số tin đã bán và đang bán, số người theo dõi, đã có số điện thoại hay chưa, thời gian trả lời thường lệ và lịch tạm vắng."
      3: "Hệ thống hiện trang đầu của các tin công khai (đang bán, đang giữ chỗ) và hai thẻ đánh giá Khi bán, Khi mua; người dùng xem thêm từng trang."
      4: "Người xem đã đăng nhập, không phải chính người bán, thấy mình đã theo dõi hay chặn người bán chưa và cuộc trò chuyện với người bán nếu có."
    alt:
      A1: { at: 3, text: "Người xem đã đăng nhập: tin mình đã ẩn khỏi kết quả không hiện, tin đã lưu được đánh dấu; có vị trí thì mỗi tin ghi khoảng cách." }
      A2: { at: 4, text: "Người xem theo dõi người bán: khi người bán đăng tin mới, hệ thống báo người theo dõi. Theo dõi lại không đổi gì; bỏ theo dõi thì không báo nữa." }
      A3: { at: 1, text: Người dùng mở danh sách người mình theo dõi và chọn một người. }
    exc:
      E1: { at: 1, text: Tài khoản không có hoặc đã xóa, error: account_not_found }
      E2: { at: 4, text: Tài khoản người xem đang bị tạm khóa nên không theo dõi được, error: account_suspended }
      E3: { at: 4, text: Hai người đã chặn nhau, br: BR-ACC-01, error: blocked }
      E4: { at: 4, text: Người xem đã theo dõi đủ 1.000 tài khoản, error: follow_limit_reached }
      E5: { at: 4, text: Theo dõi chính mình, error: invalid_follow }
      E6: { at: 4, text: Người bán vừa xóa tài khoản, error: account_deleted }
    notes: Chặn một người thì các lượt theo dõi giữa hai người bị xóa theo cả hai chiều; bỏ chặn không khôi phục lại.
  - id: UC-DSC-05
    status: done
    title: { vi: "Xem tin gợi ý trên Trang chủ (Quanh bạn, Dành cho bạn, Vì bạn đã xem gần đây)", en: "Browse Home's feeds" }
    short: { vi: "Xem tin gợi ý trên Trang chủ" }
    actors: [buyer, guest]
    fr: [FR-DSC-05]
    br: [BR-DSC-02]
    api: ["GET /v1/screens/home", "GET /v1/search"]
    pre: Không cần đăng nhập.
    post: Người dùng thấy cây danh mục và các nhóm tin gợi ý. Không dữ liệu nghiệp vụ nào bị thay đổi.
    main:
      1: Người dùng mở Trang chủ.
      2: "Hệ thống hiện cây danh mục và nhóm Quanh bạn, gồm tin đang bán trong bán kính quanh vị trí (mặc định 50 km) xếp theo độ gần và độ mới; người dùng xem thêm từng trang."
      3: "Hệ thống hiện Dành cho bạn: 20 tin xen kẽ giữa tối đa 5 danh mục con người dùng quan tâm (tin đã lưu, câu đã tìm, tin đã mở trong 30 ngày) và các tin mới nhất."
      4: "Hệ thống hiện Vì bạn đã xem gần đây, gồm tối đa 10 tin mới nhất của danh mục con người dùng mở nhiều nhất trong ngày gần nhất, trừ các tin đã mở."
    alt:
      A1: { at: 2, text: "Không có vị trí: nhóm Quanh bạn rỗng và ứng dụng xin vị trí." }
      A2: { at: 3, text: "Khách hoặc tài khoản chưa có tín hiệu nào: Dành cho bạn là các tin mới nhất." }
      A3: { at: 4, text: "Khách, chưa mở tin nào trong 30 ngày, hoặc danh mục con không còn tin để hiện: không có nhóm Vì bạn đã xem gần đây." }
    exc:
      E1: { at: 1, text: Đặt bán kính mà không có vị trí, error: position_required }
      E2: { at: 1, text: Tọa độ hoặc phường/xã không hợp lệ, error: invalid_position }
    notes: Dành cho bạn và Vì bạn đã xem gần đây bỏ cả tin của chính người xem.
  - id: UC-DSC-06
    status: done
    title: { vi: "Theo dõi tìm kiếm và nhận báo tin mới khớp", en: "Watch a search and hear of new matches" }
    short: { vi: "Theo dõi tìm kiếm" }
    actors: [buyer]
    fr: [FR-DSC-06]
    br: [BR-DSC-02, BR-DSC-03]
    nfr: [NFR-DUR-01, NFR-CONC-01, NFR-PRIV-01]
    api: ["POST /v1/search/watches", "GET /v1/search/watches", "DELETE /v1/search/watches/{id}", "POST /v1/search/watches/{id}/mute", "POST /v1/search/watches/{id}/unmute", "GET /v1/search"]
    pre: Đã đăng nhập.
    post: "Câu tìm được theo dõi cùng bộ lọc và một phường/xã; người mua thấy số tin mới khớp và được báo khi có tin mới, trừ khi đã tắt báo."
    main:
      1: "Người mua theo dõi một câu tìm với bộ lọc (danh mục, khoảng giá, tình trạng, chỉ tin nhận trả giá) và một nơi, có thể kèm bán kính."
      2: "Hệ thống đổi tọa độ thành phường/xã gần nhất và không giữ tọa độ, ghi các cụm từ mô hình đọc được để lần quét không gọi mô hình, rồi lưu lượt theo dõi và hẹn lần quét đầu."
      3: "Mỗi 30 phút hệ thống quét các tin mới đăng lần đầu, giữ tin khớp bộ lọc, nơi và mọi từ của một cụm từ, bỏ tin của chính người mua, tin đã ẩn và tin của người có chặn; có tin khớp thì cộng số tin mới và báo người mua."
      4: "Người mua xem các tìm kiếm đã theo dõi, mới nhất trước, mỗi cái kèm số tin mới."
      5: "Người mua mở một tìm kiếm đã theo dõi: hệ thống chạy lại câu tìm với bộ lọc và nơi đã lưu; trang đầu đưa số tin mới về 0."
    alt:
      A1: { at: 2, text: "Người mua đã theo dõi câu tìm này (không phân biệt hoa thường và dấu): lượt cũ giữ mã, nhận bộ lọc và nơi mới, số tin mới về 0." }
      A2: { at: 3, text: "Lần quét đọc đủ 500 tin: hệ thống quét tiếp ngay, không đợi 30 phút." }
      A3: { at: 3, text: "Người mua tắt báo của một tìm kiếm đã theo dõi: hệ thống vẫn đếm tin mới nhưng không báo; bật lại thì báo như cũ." }
      A4: { at: 4, text: "Người mua bỏ theo dõi: hệ thống dừng quét; theo dõi lại câu đó là một lượt theo dõi mới." }
    exc:
      E1: { at: 2, text: Đã theo dõi đủ 20 câu tìm, br: BR-DSC-03, nfr: NFR-CONC-01, error: watch_limit_reached }
      E2: { at: 1, text: Giá thấp nhất lớn hơn giá cao nhất, error: invalid_price_range }
      E3: { at: 1, text: Đặt bán kính mà không có nơi, error: position_required }
      E4: { at: 2, text: "Nơi không hợp lệ hoặc ở ngoài Việt Nam (không có phường/xã nào trong 30 km quanh tọa độ)", error: invalid_position }
      E5: { at: 5, text: "Tìm kiếm theo dõi không có hoặc của người khác, khi mở hoặc khi tắt, bật báo", error: watch_not_found }
      E6: { at: 5, text: Mở tìm kiếm theo dõi kèm câu tìm hoặc bộ lọc khác, error: search_conflict }
      E7: { at: 5, text: Mở tìm kiếm theo dõi khi chưa đăng nhập, error: unauthenticated }
    notes: "Lượt theo dõi chỉ giữ phường/xã, không giữ tọa độ (NFR-PRIV-01). Lần quét chạy bền qua sự cố (NFR-DUR-01) và chỉ xét tin đang bán (BR-DSC-02). Thông báo tin mới khớp đi qua module Thông báo, theo công tắc báo của từng lượt theo dõi."

