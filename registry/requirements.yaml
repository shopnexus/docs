    pre: Đã đăng nhập; tin đăng đang bán.
    post: Thương lượng ở trạng thái đã chốt giá; người mua có thể yêu cầu COD (UC-DEAL-03).
    main:
      1: Người mua mở thương lượng trên tin đăng; hệ thống mở hoặc dùng lại cuộc trò chuyện của hai người.
      2: Người mua trả giá theo BR-DEAL-03.
      3: Người bán phản giá hoặc từ chối; người đưa giá có thể rút giá của mình. Hai bên lặp lại cho tới khi một bên chấp nhận.
      4: Một bên chấp nhận đúng giá mình đang thấy; thương lượng chuyển sang đã chốt giá.
    alt:
      A1: { at: 1, text: "Người mua đã có thương lượng trên tin: hệ thống mở lại thương lượng đó." }
      A2: { at: 2, text: "Người mua chấp nhận ngay giá niêm yết, không trả giá." }
