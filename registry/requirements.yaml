    nfr: [NFR-IDEM-01, NFR-DUR-01]
    adr: [ADR-0002]
    api: ["POST /v1/listing-reads", "GET /v1/listing-reads/{id}", "GET /v1/listing-reads/{id}/events", "POST /v1/link-previews", "POST /v1/category-guesses", "POST /v1/price-guides", "GET /v1/listing-drafts", "GET /v1/listing-drafts/{id}", "PUT /v1/listing-drafts/{id}", "DELETE /v1/listing-drafts/{id}", "POST /v1/listings", "POST /v1/listings/{id}/photo-copies"]
    pre: Đã đăng nhập.
    post: Tin được lưu ở trạng thái đang xử lý; khi mọi ảnh xử lý xong, tin chuyển sang đang bán và bắt đầu xuất hiện trong kết quả tìm kiếm.
    main:
      1: Người bán chụp hoặc chọn từ thư viện 1–10 ảnh, hoặc quay video; ảnh được tải lên qua UC-SHR-01.
      2: "AI đọc ảnh, hoặc khung hình và lời nói tiếng Việt trong video, rồi điền tiêu đề, danh mục, tình trạng theo thang Mới/Như mới/Đã dùng, thông số, mô tả và khoảng giá tham khảo."
      3: Người bán sửa biểu mẫu, nhập giá, xác nhận phường/xã rồi bấm Đăng.
      4: Hệ thống kiểm quyền đăng và trần số tin của người bán (BR-LST-02), kể cả khi người bán gửi nhiều tin cùng lúc; kiểm giới hạn từng mục (BR-LST-03).
      5: Hệ thống lưu tin ở trạng thái đang xử lý, chuẩn hóa ảnh và xóa thông tin vị trí chụp trong ảnh; xong thì tin chuyển sang đang bán, ứng dụng báo "Đã đăng tin".
    alt:
      A1: { at: 2, text: "Mô hình không trả kết quả: người bán tự điền biểu mẫu, tiếp tục bước 3." }
      A2: { at: 1, text: "Người bán dán link tin của mình trên Chợ Tốt: hệ thống hiện thẻ xem trước rồi đọc tin đó thành biểu mẫu, bỏ số điện thoại và Zalo trong mô tả." }
      A3: { at: 3, text: "Hệ thống hiện các tin tương tự, số người mua đang theo dõi loại hàng này và hai mức gợi ý: giá thị trường và giá bán nhanh, kèm số ngày bán." }
      A4: { at: 3, text: "Người bán lưu nháp và quay lại sau; nháp giữ ảnh đã tải." }
      A5: { at: 1, text: "Người bán đăng lại từ một tin cũ của mình: ảnh của tin đó được chép thành ảnh tải lên mới." }
      A6: { at: 4, text: "Ứng dụng gửi lại cùng một lần đăng: trả đúng tin của lần đầu, không tạo tin thứ hai.", nfr: NFR-IDEM-01 }
    exc:
      E1: { at: 4, text: "Tài khoản đang bị tạm khóa: từ chối đăng.", br: BR-LST-02, error: account_suspended }
      E2: { at: 4, text: "Đã có 20 tin đang bán: từ chối, báo số tin tối đa.", br: BR-LST-02, error: listing_cap_reached }
      E3: { at: 5, text: "Có ảnh lỗi: tin chuyển sang bị từ chối kèm lý do; sửa tin hoặc thêm ảnh đưa tin về đang xử lý." }
      E4: { at: 4, text: Người bán chưa có số điện thoại, br: BR-ACC-03, error: phone_required }
      E5: { at: 4, text: Nội dung tin sai giới hạn, br: BR-LST-03, error: invalid_listing }
      E6: { at: 2, text: "Người bán đã dùng hết lượt đọc bằng AI trong 24 giờ (30 video, 60 ảnh, 30 link)", error: read_limit_reached }
      E7: { at: 1, text: Link không phải tin trên Chợ Tốt, error: unsupported_source }
      E8: { at: 4, text: "Ảnh không thuộc người bán hoặc chưa tải xong", error: invalid_upload }
