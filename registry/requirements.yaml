      A3: { at: 4, text: "Sau khi chốt, một bên hủy chốt giá khi chưa có đơn: phiên trả giá quay lại bước 2." }
      A4: { at: 3, text: "Người bán đổi giá niêm yết, tắt trả giá hoặc ẩn tin: giá đang mở bị rút. Tin đã bán hoặc bị xóa thì chốt giá chưa có đơn cũng bị bỏ." }
