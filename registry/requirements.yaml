    api: ["POST /v1/orders/{order_id}/shipment", "GET /v1/shipments/quote"]
    pre: Có đơn ở trạng thái chờ tạo đơn; người bán đã liên kết tài khoản GHTK hoặc GHN (UC-ACC-04).
    post: Đơn ở trạng thái đã gửi, vận đơn chờ hãng lấy hàng; tin đăng được giữ cho đơn này; các đơn chờ khác trên tin bị hủy.
    main:
      1: "Người bán chọn hãng đã liên kết, dịch vụ, khối lượng, cách giao hàng cho shipper và nơi lấy hàng: điểm lấy hàng trên tài khoản hãng, một địa chỉ của mình hoặc địa chỉ lấy hàng đã lưu. Ứng dụng hiện phí vận chuyển hãng báo."
      2: Hệ thống kiểm tra đơn và tin đăng, rồi giữ tin đăng cho đơn.
      3: Hệ thống tạo vận đơn trên tài khoản hãng của người bán, thu hộ tiền hàng, người nhận trả phí vận chuyển; mã đơn ShopNexus là mã tham chiếu ở hãng.
      4: Đơn chuyển sang đã gửi; các đơn chờ khác trên tin tự hủy với lý do "đã gửi cho người khác".
      5: Hệ thống bắt đầu đếm thời hạn hãng lấy hàng và theo dõi trạng thái vận đơn.
    alt:
      A1: { at: 1, text: "Ứng dụng gửi lại cùng một yêu cầu: trả đúng kết quả lần đầu, không tạo thêm vận đơn, kể cả khi địa chỉ lấy hàng đã lưu vừa bị xóa.", nfr: NFR-IDEM-01 }
      A2: { status: retired, at: 4, text: "Hãng báo vận đơn nhập tay đã giao: hệ thống hẹn giờ tự hoàn tất đơn." }
      A3: { status: retired, at: 5, text: "Người bán sửa mã vận đơn nhập tay khi hàng chưa giao." }
    exc:
      E1: { status: retired, at: 3, text: Mã vận đơn không thuộc tài khoản hãng của người bán, error: shipment_not_found }
      E2: { at: 3, text: "Hệ thống không bật hãng đó; tin đăng được trả lại", error: carrier_unavailable }
      E3: { at: 3, text: "Người bán chưa liên kết hãng, phải liên kết lại, hoặc vừa bỏ liên kết hay đổi cửa hàng trong lúc tạo vận đơn; tin đăng được trả lại", error: carrier_not_linked }
      E4: { at: 3, text: "Hãng không biết địa chỉ người nhận hoặc nơi lấy hàng; tin đăng được trả lại", error: carrier_address_unknown }
      E5: { at: 2, text: Tin không còn đang bán, error: listing_unavailable }
      E6: { at: 1, text: "Vận đơn sai quy tắc: hãng khác GHTK/GHN, dịch vụ, khối lượng hoặc nơi lấy hàng không hợp lệ", error: invalid_shipment }
      E7: { at: 4, text: "Đơn bị hủy cùng lúc: tin đăng được trả lại, vận đơn vừa tạo bị hủy trên hãng", nfr: NFR-CONC-01, error: deal_changed }
      E8: { at: 2, text: Đơn không còn chờ tạo đơn hoặc người gọi là người mua, error: move_not_allowed }
      E9: { at: 2, text: Người bán chọn địa chỉ lấy hàng đã lưu nhưng chưa lưu địa chỉ nào, error: pickup_not_configured }
      E10: { at: 3, text: "Hãng từ chối vận đơn, ví dụ số điện thoại sai; ứng dụng hiện lý do của hãng, tin đăng được trả lại", error: carrier_refused }

