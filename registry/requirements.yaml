      A2: { at: 5, text: "Người dùng nhắn tiếp vào phiếu đã xử lý: phiếu mở lại và chờ trả lời; điều phối viên cũng mở lại được." }
      A3: { at: 5, text: "Phiếu xin thêm hãng: trước khi đánh dấu đã xử lý, hệ thống gửi tin «Đã ghi nhận hãng …»." }
      A4: { at: 1, text: "Tài khoản đang bị tạm khóa vẫn đăng nhập, gửi phiếu hỗ trợ và nhắn trong phiếu; ứng dụng chỉ mở màn hình tạm khóa, từ đó người dùng gửi phiếu và xem các phiếu của mình.", br: BR-MOD-02 }
      A5: { at: 5, text: "Người dùng xóa tài khoản: các phiếu đang mở chuyển sang đã xử lý." }
