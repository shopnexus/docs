      A1: { at: 4, text: "Hãng báo lặp một bước, hoặc báo một bước cũ hơn: hệ thống chỉ ghi nhận lần đầu, đơn không đổi trạng thái hai lần.", nfr: NFR-IDEM-01 }
      A2: { at: 4, text: "Người mua bấm Đã nhận hàng trước khi hãng báo: đơn hoàn tất ngay." }
      A3: { at: 4, text: "Người mua chưa nhận được hàng khi đơn đang giao, hoặc trong 7 ngày sau khi hệ thống tự hoàn tất đơn: người mua gửi phiếu Báo chưa nhận hàng (UC-MOD-09)." }
      A4: { at: 4, text: "Hãng báo đã giao mà người mua không bấm: 3 ngày sau hệ thống tự hoàn tất đơn.", br: BR-DEAL-11 }
    exc:
      E1: { at: 1, text: "Hãng chưa lấy hàng sau 3 ngày: đơn bị hủy, vận đơn trên tài khoản hãng bị hủy theo (UC-DEAL-06 A2)." }
      E2: { at: 3, text: "Người mua không ưng hàng: người mua từ chối nhận, không trả đồng nào; hãng hoàn hàng, đơn giao không thành, hãng tính phí hai chiều vào tài khoản người bán.", br: BR-DEAL-08 }
      E3: { at: 4, text: Đơn không còn ở trạng thái đã gửi hoặc người gọi là người bán, error: move_not_allowed }
      E4: { at: 1, text: "Hãng làm mất hàng sau khi lấy, hoặc 30 ngày sau khi lấy hàng mà hãng không còn biết vận đơn: đơn giao không thành, vận đơn ghi thất lạc. Đơn không tính vào số đơn giao không thành của người mua và không được đánh giá. Tin bị ẩn vì người bán không còn hàng, người bán tự hiện lại khi có hàng. Người bán được báo yêu cầu hãng bồi thường trên tài khoản hãng của mình; người mua được báo không phải trả gì.", br: BR-DEAL-11 }

