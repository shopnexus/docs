  # ---- DEAL ----
  - id: UC-DEAL-01
    was: [UC-13]
    status: done
    title: { vi: "Nhắn tin theo tin đăng", en: "Chat about a listing" }
    actors: [user]
    fr: [FR-DEAL-01]
    br: [BR-ACC-01, BR-ACC-03]
    pre: Đã đăng nhập.
    post: Hai người có một cuộc trò chuyện chung; mọi thương lượng giữa hai người hiện trong cuộc trò chuyện đó.
    main:
      1: Người dùng mở cuộc trò chuyện từ một tin đăng.
      2: Hệ thống mở cuộc trò chuyện của hai người, hoặc dùng lại cuộc trò chuyện đã có.
      3: Hai bên gửi tin nhắn văn bản hoặc ảnh; bước của thương lượng và của đơn hiện thành tin nhắn hệ thống trong cuộc trò chuyện.
    exc:
      E1: { at: 2, text: Hai người đã chặn nhau, br: BR-ACC-01, error: blocked }
      E2: { at: 2, text: Người dùng chưa có số điện thoại, br: BR-ACC-03, error: phone_required }
    gaps:
      - Phần nhắn tin nằm ở module chat, chưa gắn tag. Module deal mới gắn phần tin nhắn hệ thống (bước 3).

