# Nguồn duy nhất cho mã yêu cầu của ShopNexus.
#
# Báo cáo Typst (typst/common/req.typ) và web docs (web/src/lib/registry.ts)
# đọc thẳng file này. Code server chỉ trỏ tới mã; `make trace` ở repo gốc
# kiểm tra mã thiếu, thừa và lệch. Đổi mã bằng `make trace-rename`, không
# sửa tay.
#
# Quy ước:
# - UC-<NHÓM>-nn, FR-<NHÓM>-nn, BR-<NHÓM>-nn; NFR-<THUỘC TÍNH>-nn; ADR-nnnn.
# - Luồng trong UC: A1… là luồng thay thế (vẫn đạt mục tiêu), E1… là luồng
#   ngoại lệ (dừng, không đạt mục tiêu). `at` là bước của luồng chính nơi
#   luồng tách ra.
# - Số đã cấp không đổi, không dùng lại. Bỏ một mục hoặc một luồng thì đặt
#   `status: retired`.
# - `was` giữ mã cũ: `trace rename --from-was` dùng nó để đổi mã trong
#   tài liệu, và `trace check` báo lỗi khi còn chỗ dùng mã cũ.
# - status: untraced (chưa xét, chưa gắn tag) | planned | doing | done | retired.
# - `gaps` ghi chỗ code đang khác đặc tả, để cả báo cáo lẫn web cùng thấy.

groups:
  ACC: { vi: Tài khoản và định danh, en: Accounts and identity }
  LST: { vi: Đăng bán, en: Listings }
  DSC: { vi: Khám phá, en: Discovery }
  DEAL: { vi: Trao đổi và giao dịch, en: Chat and deals }
  TRS: { vi: Hậu giao dịch và uy tín, en: After the sale and trust }
  MOD: { vi: Vận hành, en: Operations }
  SHR: { vi: Ca dùng chung («include»), en: Shared use cases («include») }

actors:
  user: { vi: Người dùng, en: User }
  buyer: { vi: Người mua, en: Buyer }
  seller: { vi: Người bán, en: Seller }
  guest: { vi: Khách, en: Guest }
  carrier: { vi: Hãng vận chuyển, en: Carrier }
  moderator: { vi: Điều phối viên, en: Moderator }
  admin: { vi: Quản trị viên, en: Administrator }
  llm: { vi: Dịch vụ AI, en: AI service }
  sub: { vi: Ca con, en: Sub use case }

