    post: "Nhận: đơn hoàn tất, tin và phiên trả giá đã bán. Từ chối: đơn giao không thành, tin về đang bán, phiên trả giá về đang trả giá, số đơn giao không thành của người mua tăng (UC-TRS-04). Hai trường hợp này, hai bên được đánh giá nhau (UC-TRS-01). Hàng thất lạc: đơn giao không thành do hãng, không tính cho bên nào và không được đánh giá; tin bị ẩn, phiên trả giá về đang trả giá."
    main:
      1: Hãng lấy hàng và báo từng bước về hệ thống; hệ thống cũng hỏi lại hãng mỗi 2 giờ. Màn hình đơn hiện các bước và phí vận chuyển, hai bên nhận thông báo.
      2: Shipper mang hàng tới cửa người mua.
      3: Người mua xem hàng, đồng ý nhận và trả tiền hàng cùng phí vận chuyển cho shipper.
      4: Hãng báo đã giao; người mua bấm Đã nhận hàng; hệ thống chuyển đơn sang hoàn tất, đánh dấu tin đã bán và đóng phiên trả giá.
