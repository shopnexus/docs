    nfr: [NFR-DUR-01, NFR-IDEM-01, NFR-CONC-01]
    adr: [ADR-0001, ADR-0002]
    api: ["POST /v1/orders/{order_id}/shipment", "PUT /v1/orders/{order_id}/shipment", "GET /v1/shipments/lookup"]
    pre: Có đơn đang chờ gửi; người bán đã liên kết tài khoản GHTK hoặc GHN (UC-ACC-04).
    post: Đơn ở trạng thái đã gửi, tin đăng được giữ cho đơn này; các đơn chờ khác trên tin bị hủy.
    main:
      1: Người bán chọn tạo vận đơn qua hãng đã liên kết (điểm lấy hàng, dịch vụ, khối lượng), hoặc nhập mã vận đơn đã tạo trên ứng dụng của hãng đó.
      2: Hệ thống giữ tin đăng cho đơn.
      3: Hệ thống tạo vận đơn trên tài khoản hãng của người bán, thu hộ tiền hàng, người nhận trả phí ship; với mã nhập tay, hệ thống đọc vận đơn bằng tài khoản hãng của người bán.
      4: Đơn chuyển sang đã gửi; các đơn chờ khác trên tin tự hủy với lý do "đã gửi cho người khác".
      5: Hệ thống bắt đầu đếm thời hạn hãng lấy hàng và theo dõi trạng thái vận đơn.
    alt:
      A1: { at: 1, text: "Ứng dụng gửi lại cùng một yêu cầu: trả đúng kết quả lần đầu, không tạo thêm vận đơn." }
      A2: { at: 4, text: "Hãng báo vận đơn nhập tay đã giao: hệ thống hẹn giờ tự hoàn tất đơn." }
      A3: { at: 5, text: "Người bán sửa mã vận đơn nhập tay khi hàng chưa giao." }
    exc:
      E1: { at: 3, text: Mã vận đơn không thuộc tài khoản hãng của người bán, br: BR-DEAL-12, error: shipment_not_found }
      E2: { at: 1, text: Hệ thống không bật hãng vận chuyển nào, error: carrier_unavailable }
      E3: { at: 1, text: Người bán chưa liên kết hãng, error: carrier_not_linked }
      E4: { at: 3, text: Hãng không giao tới địa chỉ; tin đăng được trả lại, error: carrier_address_unknown }
      E5: { at: 2, text: Tin không còn đang bán, error: listing_unavailable }
      E6: { at: 3, text: Vận đơn sai quy tắc hoặc hãng báo vận đơn hỏng, error: invalid_shipment }
      E7: { at: 4, text: "Đơn bị hủy cùng lúc: tin đăng được trả lại, vận đơn vừa tạo bị hủy trên hãng", nfr: NFR-CONC-01 }
      E8: { at: 1, text: Đơn không còn chờ gửi hoặc không phải của người bán, error: move_not_allowed }

  - id: UC-DEAL-05
    was: [UC-17]
    status: done
    title: { vi: "Theo dõi đơn và nhận hàng đồng kiểm (nhận hoặc từ chối tại cửa)", en: "Track an order and inspect on delivery" }
    short: { vi: "Theo dõi đơn và nhận hàng đồng kiểm" }
    actors: [buyer]
    actorsNote: hãng vận chuyển báo trạng thái
    secondary: [carrier]
    fr: [FR-DEAL-04]
    br: [BR-DEAL-02, BR-DEAL-05, BR-DEAL-08, BR-DEAL-09, BR-DEAL-11]
    nfr: [NFR-IDEM-01, NFR-DUR-01]
    api: ["POST /v1/orders/{order_id}/confirm", "POST /v1/carriers/{carrier}/webhook/{secret}"]
    pre: "UC-DEAL-04 đã hoàn tất: đơn ở trạng thái đã gửi, vận đơn nằm trên tài khoản GHTK/GHN của người bán."
    post: "Nhận: đơn hoàn tất, tin và thương lượng đã bán, hai bên được mời đánh giá nhau (UC-TRS-01). Từ chối: đơn giao không thành, tin về đang bán, thương lượng về đang thương lượng, số đơn giao không thành của người mua tăng (UC-TRS-04)."
    main:
      1: Hãng lấy hàng và báo trạng thái về hệ thống; ứng dụng cập nhật màn hình đơn và gửi thông báo đẩy. Hãng không báo thì hệ thống hỏi lại mỗi 2 giờ.
      2: Shipper mang hàng tới cửa người mua.
      3: Người mua xem hàng, đồng ý nhận và trả tiền hàng cùng phí ship chiều đi cho shipper.
      4: Hãng báo đã giao; người mua bấm đã nhận hàng; hệ thống chuyển đơn sang hoàn tất, đánh dấu tin đã bán và đóng thương lượng.
    alt:
      A1: { at: 4, text: "Hãng báo lặp cùng một trạng thái của cùng một vận đơn: hệ thống chỉ ghi nhận lần đầu, đơn không đổi trạng thái hai lần.", nfr: NFR-IDEM-01 }
      A2: { at: 4, text: "Người mua bấm đã nhận hàng trước khi hãng báo: đơn hoàn tất ngay." }
      A3: { at: 4, text: "Đơn đã báo giao mà người mua chưa nhận được hàng: người mua gửi phiếu Báo chưa nhận hàng (UC-MOD-09)." }
      A4: { at: 4, text: "Hãng báo đã giao mà người mua không bấm: 3 ngày sau hệ thống tự hoàn tất đơn.", br: BR-DEAL-11 }
    exc:
      E1: { at: 1, text: "Hãng chưa lấy hàng sau 3 ngày: đơn bị hủy, vận đơn trên tài khoản hãng bị hủy theo (UC-DEAL-06 A2)." }
      E2: { at: 3, text: "Người mua không ưng hàng: người mua từ chối nhận, không trả đồng nào; hãng hoàn hàng, đơn giao không thành, hãng tính phí hai chiều vào tài khoản người bán.", br: BR-DEAL-08 }
      E3: { at: 4, text: Đơn không còn ở trạng thái đã gửi, error: move_not_allowed }

