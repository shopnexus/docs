      E1: { at: 1, text: "Không có mức hài lòng lẫn nội dung, hoặc sai giới hạn", error: invalid_feedback }
      E2: { at: 2, text: "Quá 20 góp ý trong 24 giờ", error: too_many_feedback }
      E3: { at: 3, text: "Góp ý không có hoặc tài khoản gửi đã xóa", error: feedback_not_found }
    notes: "Góp ý không cần trả lời; một câu hỏi cần trả lời là phiếu hỗ trợ loại yêu cầu khác (UC-MOD-09). Xóa tài khoản thì xóa góp ý của tài khoản đó."
  - id: UC-MOD-12
    status: done
    title: { vi: "Cài đặt AI (agent, mô hình, giá, ngân sách)", en: "Configure AI (agents, models, prices, budgets)" }
    short: { vi: "Cài đặt AI" }
    actors: [admin]
    fr: [FR-MOD-06]
    nfr: [NFR-CONC-01]
    api: ["GET /v1/console/settings/providers", "GET /v1/console/settings/providers/{name}/models", "GET /v1/console/settings/models", "PUT /v1/console/settings/models/tags", "PUT /v1/console/settings/models/price", "GET /v1/console/settings/agents", "POST /v1/console/settings/agents", "GET /v1/console/settings/agents/usage", "GET /v1/console/settings/agents/activity", "PATCH /v1/console/settings/agents/{id}", "GET /v1/console/settings/agents/{id}/versions", "GET /v1/console/settings/spend"]
    pre: "Quản trị viên đã đăng nhập trang điều hành (UC-MOD-10). Nhà cung cấp mô hình và khóa API do hạ tầng cấu hình trong cổng AI."
    post: "Chính sách AI mới được lưu, ghi nhật ký (UC-SHR-02) và ghi vào cổng AI; mọi phần của máy chủ và trợ lý AI dùng nó từ lần gọi kế tiếp."
    main:
      1: "Quản trị viên mở Cài đặt AI: nhà cung cấp và tình trạng, mô hình kèm thẻ và giá, các agent và chi tiêu."
      2: "Quản trị viên đổi một agent (mô hình, mô hình dự phòng, giới hạn, ngân sách tháng, giới hạn của từng bên gọi; với agent của trang điều hành thêm chỉ dẫn và công cụ), hoặc đổi thẻ hay giá của một mô hình."
      3: "Hệ thống kiểm tra thay đổi, lưu và ghi nhật ký kiểm toán trong cùng giao dịch."
      4: "Hệ thống ghi chính sách vào cổng AI: mỗi agent một nhóm với ngân sách tháng, mỗi bên gọi một khóa ảo chỉ gọi được mô hình của agent, mỗi giá một bảng giá."
    alt:
      A1: { at: 2, text: "Quản trị viên tạo một agent mới cho trang điều hành; agent có một bên gọi cùng tên. Gửi lại cùng yêu cầu tạo thì hệ thống dùng agent đã tạo." }
      A2: { at: 4, text: "Cổng AI không trả lời: thay đổi vẫn được lưu và lần đồng bộ định kỳ (5 phút) áp dụng sau.", error: ai_gateway_unavailable }
      A3: { at: 3, text: "Quản trị viên sửa chỉ dẫn của agent trang điều hành: hệ thống lưu thành phiên bản mới, xem lại được các phiên bản cũ." }
      A4: { at: 1, text: "Quản trị viên xem chi tiêu theo ngày và theo agent, số lượt gọi, các lệnh API mỗi agent đã gọi (số lần chờ duyệt, số lần lỗi) và các lần bị chặn: lượt lặp, hết ngân sách, giới hạn tốc độ." }
    exc:
      E1: { at: 3, text: "Mô hình hoặc mô hình dự phòng chưa có giá", error: ai_model_unpriced }
      E2: { at: 3, text: "Mô hình thiếu thẻ mà agent cần", error: ai_model_lacks_tags }
      E3: { at: 3, text: "Agent của ứng dụng chỉ đổi mô hình, mô hình dự phòng, giới hạn và ngân sách", error: ai_agent_app_fixed }
      E4: { at: 3, text: "Cấu hình agent sai, ví dụ agent tạo vector có mô hình dự phòng", error: ai_agent_invalid }
      E5: { at: 3, text: "Tên hoặc slug đã có agent hay bên gọi khác dùng", error: ai_agent_taken }
      E6: { at: 1, text: "Điều phối viên mở Cài đặt AI", error: console_forbidden }


  # ---- SHR ----
  - id: UC-SHR-01
    was: [UC-S1]
    status: done
    title: { vi: "Tải ảnh lên (kiểm tra, chuẩn hóa và lưu ảnh)", en: "Upload photos" }
    short: { vi: "Tải ảnh lên" }
    actors: [sub]
    fr: [FR-SHR-01]
    nfr: [NFR-PRIV-01, NFR-IDEM-01, NFR-DUR-01]
    api: ["POST /v1/uploads"]
    pre: "Đã đăng nhập; một ca khác (đăng tin, nhắn tin, đánh giá, ảnh đại diện) cần ảnh."
    post: "Ảnh đã gắn vào mục dùng nó và được chuẩn hóa thành ảnh công khai không còn thông tin vị trí chụp; bản gốc đã xóa."
    main:
      1: "Ứng dụng xin chỗ tải lên cho một ảnh (JPEG, PNG hoặc WebP đến 15 MB) hoặc một video (MP4 hoặc QuickTime đến 50 MB)."
      2: "Hệ thống trả đường dẫn tải lên có hạn 15 phút; ứng dụng tải tệp thẳng lên kho lưu trữ, tệp không đi qua máy chủ."
      3: "Ca gọi gắn ảnh vào mục của mình (tin đăng, tin nhắn, đánh giá) trong 24 giờ: gắn tất cả hoặc không ảnh nào."
      4: "Hệ thống kiểm tệp đúng loại đã khai, chuẩn hóa ảnh (đúng chiều, tối đa 1600 px, kèm ảnh nhỏ 400 px), bỏ mọi thông tin trong ảnh kể cả vị trí chụp, rồi xóa bản gốc."
    alt:
      A1: { at: 3, text: "Nháp tin đăng giữ ảnh thêm 30 ngày từ lần lưu nháp; không gì rút ngắn hạn đó." }
      A2: { at: 4, text: "Ảnh đại diện được cắt vuông tối đa 400 px, không có ảnh nhỏ." }
      A3: { at: 1, text: "Hệ thống tự lưu ảnh cho người dùng (khung hình của video, ảnh chép từ tin Chợ Tốt hoặc từ tin cũ): ảnh đó chờ gắn như ảnh ứng dụng tải lên." }
      A4: { at: 3, text: "Ca gọi gắn lại cùng ảnh: ảnh mục đó đã giữ vẫn qua, không lỗi.", nfr: NFR-IDEM-01 }
      A5: { at: 3, text: "Video chỉ dùng cho lượt đọc tin bằng AI: lượt đọc giữ video và xóa nó khi đọc xong." }
      A6: { at: 4, text: "Mục bỏ ảnh (sửa tin bỏ ảnh, xóa tin): bản gốc xóa ngay, bản công khai xóa sau 24 giờ; ảnh bìa của tin đã xóa ở lại cho đơn và cuộc trò chuyện." }
    exc:
      E1: { at: 1, text: Loại tệp hoặc cỡ tệp không được phép, error: invalid_request }
      E2: { at: 3, text: "Ảnh không thuộc người dùng, chưa tải xong, khác loại hoặc cỡ đã khai, đã hết hạn hoặc là video", error: invalid_upload }
      E3: { at: 4, text: "Tệp không phải ảnh như đã khai hoặc quá 40 megapixel: ảnh lỗi kèm lý do; tin đăng chứa nó bị từ chối (UC-LST-01 E3)." }
      E4: { at: 3, text: "Không ca nào gắn ảnh trong 24 giờ: ảnh hết hạn và bị xóa cùng tệp." }
  - id: UC-SHR-02
    was: [UC-S2]
    status: done
    title: { vi: "Ghi nhật ký kiểm toán", en: "Write the audit log" }
    actors: [sub]
    fr: [FR-MOD-02]
    br: [BR-MOD-03]
    pre: "Một nhân viên trên trang điều hành, hoặc công cụ dòng lệnh, vừa đổi dữ liệu."
    post: "Thay đổi và dòng nhật ký cùng được lưu, hoặc cùng không."
    main:
      1: "Ca gọi tới (tạm khóa, quản lý nhân viên, phiếu hỗ trợ, ca báo cáo, ẩn tin, góp ý, cài đặt AI, vai trò tối thiểu của bảng theo dõi) tạo một dòng nhật ký: người làm, địa chỉ IP, thao tác, đối tượng và chi tiết như lý do tạm khóa."
      2: "Dòng nhật ký được ghi trong cùng giao dịch với thay đổi."
    alt:
      A1: { at: 1, text: "Thao tác thấy thay đổi đã có sẵn (bấm lại hoặc gửi lại): không đổi gì và không ghi dòng thứ hai." }
    notes: "Chi tiết không bao giờ chứa mật khẩu, mã băm hay khóa bí mật. Quản trị viên tra cứu nhật ký ở UC-MOD-05."
  - id: UC-SHR-03
    status: done
    title: { vi: "Thông báo cho người dùng (danh sách trong ứng dụng, thông báo đẩy, email)", en: "Notify people" }
    short: { vi: "Thông báo" }
    actors: [sub]
    fr: [FR-SHR-02]
    br: [BR-SHR-01, BR-SHR-02]
    nfr: [NFR-MSG-01, NFR-DUR-01, NFR-IDEM-01]
    api: ["GET /v1/notifications", "POST /v1/notifications/{id}/read", "POST /v1/notifications/read-all", "POST /v1/notifications/unread", "PUT /v1/me/push-token", "DELETE /v1/me/push-token", "GET /v1/me/notification-settings", "PUT /v1/me/notification-settings"]
    pre: "Một ca khác vừa ghi một sự kiện: bước của phiên trả giá hay đơn COD, tin nhắn, tin lên sàn hay bị từ chối, đánh giá, tìm kiếm theo dõi có tin mới, tin đã lưu giảm giá, tạm khóa, góp ý hoặc tin Chợ Tốt."
    post: "Người nhận thấy thông báo trong danh sách cùng số chưa đọc; thông báo đẩy và email tới người nhận khi cài đặt của họ cho phép."
    main:
      1: "Hệ thống nhận sự kiện và đọc lại dữ liệu hiện tại của thứ sự kiện nói tới (cuộc giao dịch, tin, đánh giá, tìm kiếm theo dõi, góp ý)."
      2: "Hệ thống chọn người nhận và loại thông báo: bên kia của bước trả giá hay của đơn, người bán của tin, người theo dõi người bán, người được đánh giá, chủ tìm kiếm theo dõi, người lưu tin, chủ góp ý hoặc chủ tài khoản."
      3: "Hệ thống ghi thông báo vào danh sách của người nhận. Thông báo về cùng một thứ (một cuộc giao dịch, một tin, một người bán đang theo dõi, một tìm kiếm theo dõi, một tin đã lưu, một góp ý) thay thông báo chưa đọc trước đó, giữ mã của nó và lên đầu danh sách; thông báo trước đã đọc thì thông báo mới thành dòng mới. Ứng dụng đang mở được báo qua luồng cập nhật trực tiếp để làm mới danh sách và số chưa đọc."
      4: "Hệ thống gửi thông báo đẩy qua Firebase Cloud Messaging tới mọi điện thoại và trình duyệt có phiên đăng nhập còn hiệu lực của người nhận, bằng ngôn ngữ người nhận dùng; thông báo đẩy mới thay mục cũ của cùng thông báo trên khay."
      5: "Thông báo về đơn COD được gửi thêm email khi người nhận bật email đơn hàng; thông báo tạm khóa và mở khóa tài khoản luôn được gửi email."
      6: "Người dùng mở danh sách thông báo, mới nhất trước, kèm số chưa đọc; bấm một thông báo thì nó thành đã đọc và ứng dụng mở màn hình nó nói tới (cuộc giao dịch, đơn, tin, tìm kiếm theo dõi, tài khoản, góp ý)."
    alt:
      A1: { at: 1, text: "Sự kiện được giao lại: thông báo của sự kiện đó đã ghi, nên không ghi và không gửi thêm gì.", nfr: NFR-IDEM-01 }
      A2: { at: 1, text: "Thứ sự kiện nói tới không còn (tin đã xóa, tìm kiếm theo dõi đã bỏ, góp ý đã sang trạng thái khác): không báo ai." }
      A3: { at: 2, text: "Tin nhắn trò chuyện chỉ được đẩy, không ghi vào danh sách vì hộp thư đã có; tin trong cuộc trò chuyện người nhận đã bỏ qua thì không đẩy. Trả lời trong phiếu hỗ trợ chỉ đẩy tới chủ phiếu và mở phiếu." }
      A4: { at: 2, text: "Giá đề nghị hoặc phản giá tới người đã bỏ qua cuộc trò chuyện với bên kia thì không báo; rút giá không báo ai. Bước của đơn vẫn được báo." }
      A5: { at: 2, text: "Đánh giá còn ẩn: hệ thống chờ tới khi đánh giá hiện mới báo. Tin đầu tiên lên sàn của người bán: mỗi người theo dõi được báo riêng, chỉ khi tin còn đang bán lúc báo." }
      A6: { at: 3, text: "Sự kiện đến trễ, sau một thông báo mới hơn về cùng thứ (đã đọc hay chưa): không ghi và không đẩy, để nội dung cũ không quay lại." }
      A7: { at: 4, text: "Ứng dụng đăng ký mã thiết bị FCM cho phiên đang dùng và gỡ mã khi đăng xuất. Mã đó bị gỡ khỏi phiên khác đang giữ nó, nên điện thoại đăng nhập tài khoản khác thôi nhận thông báo của tài khoản trước." }
      A8: { at: 4, text: "Người dùng bật tắt từng loại thông báo đẩy (tin nhắn, trả giá, đơn, giảm giá tin đã lưu, tin mới của người bán đang theo dõi, đánh giá), email đơn hàng và giờ yên lặng; tài khoản chưa lưu cài đặt dùng mặc định: bật hết, yên lặng 22:00–07:00 giờ Việt Nam.", br: BR-SHR-01 }
      A9: { at: 4, text: "Loại thông báo đang tắt, hoặc đang trong giờ yên lặng: không đẩy và cũng không đẩy sau; thông báo vẫn nằm trong danh sách.", br: BR-SHR-01 }
      A10: { at: 4, text: "Phiên của một thiết bị đã kết thúc, hoặc FCM báo mã thiết bị không còn dùng được: hệ thống xóa mã đó và không gửi tới nó." }
      A11: { at: 4, text: "FCM quá tải, lỗi máy chủ hoặc lỗi mạng: hệ thống thử lại tới một giờ; lỗi khác thì bỏ lần đẩy đó và ghi nhật ký. Thông báo vẫn nằm trong danh sách." }
      A12: { at: 5, text: "Người nhận không có email, hoặc dịch vụ thư từ chối địa chỉ: không gửi email, thông báo vẫn nằm trong danh sách. Email không theo công tắc thông báo đẩy hay giờ yên lặng." }
      A13: { at: 6, text: "Người dùng đánh dấu tất cả đã đọc; hệ thống trả mã các thông báo vừa đổi để ứng dụng hoàn tác." }
      A14: { at: 6, text: "Người dùng đánh dấu chưa đọc một thông báo, hoặc hoàn tác đánh dấu tất cả, mỗi lần tối đa 500 mã: trong các thông báo về cùng thứ chỉ thông báo mới nhất thành chưa đọc, và không thông báo nào khi thứ đó đã có thông báo chưa đọc; mã lạ hoặc của người khác bị bỏ qua." }
    exc:
      E1: { at: 6, text: "Thông báo không có hoặc thuộc người khác", error: notification_not_found }
      E2: { at: 4, text: "Mã thiết bị rỗng hoặc dài hơn 4096 ký tự", error: invalid_push_token }
      E3: { at: 4, text: "Giờ yên lặng bắt đầu trùng giờ kết thúc, hoặc không theo dạng HH:MM", br: BR-SHR-01, error: invalid_quiet_hours }
      E4: { at: 4, text: "Tài khoản vừa bị xóa khi đăng ký mã thiết bị hoặc lưu cài đặt: không lưu gì", error: session_revoked }
    notes: "Thông báo chỉ lưu loại và tham số, không lưu chữ, nên đọc được bằng tiếng Việt hoặc tiếng Anh. Tìm kiếm theo dõi đẩy theo chuông riêng của từng tìm kiếm. Xóa tài khoản thì thông báo, mã thiết bị và cài đặt của tài khoản bị xóa theo (UC-ACC-09)."

fr:
  - { id: FR-ACC-01, was: [REQ-01], module: Xác thực, uc: [UC-ACC-01], text: { vi: "Đăng nhập bằng số điện thoại (Firebase), tài khoản Google hoặc mã OTP gửi email; lần đầu tự tạo tài khoản" } }
  - { id: FR-ACC-02, was: [REQ-02], module: Xác thực, uc: [UC-ACC-02], text: { vi: "Liệt kê thiết bị đang đăng nhập; đăng xuất thiết bị đang dùng, một thiết bị hoặc mọi thiết bị khác; làm mới phiên; xác nhận đăng nhập lại" } }
  - { id: FR-ACC-03, was: [REQ-03], module: Tài khoản, uc: [UC-ACC-06], text: { vi: "Sửa tên hiển thị, giới thiệu, ảnh đại diện; bật và tắt chế độ vắng mặt" } }
  - { id: FR-ACC-04, was: [REQ-04], status: retired, module: Định danh, uc: [UC-ACC-03, UC-MOD-03], text: { vi: "eKYC: chụp hai mặt CCCD, đọc chip NFC, quét khuôn mặt; chuyển duyệt tay khi không đọc được chip" } }
  - { id: FR-ACC-05, was: [REQ-05], module: Vận chuyển, uc: [UC-ACC-04], text: { vi: "Thiết lập giao COD: liên kết tài khoản GHTK/GHN sẵn có của người bán, gỡ liên kết, lưu địa chỉ lấy hàng" } }
  - { id: FR-ACC-06, module: Tài khoản, uc: [UC-ACC-05], text: { vi: "Chặn, bỏ chặn và xem danh sách người mình chặn" } }
  - { id: FR-ACC-07, module: Tài khoản, uc: [UC-ACC-07], text: { vi: "Sổ địa chỉ: thêm, sửa, xóa, chọn địa chỉ mặc định; tối đa 10 địa chỉ" } }
  - { id: FR-ACC-08, module: Xác thực, uc: [UC-ACC-08], text: { vi: "Thêm số điện thoại hoặc email vào tài khoản đang có" } }
  - { id: FR-ACC-09, module: Tài khoản, uc: [UC-ACC-09], text: { vi: "Xóa tài khoản; các module tự dọn dữ liệu của người dùng" } }
  - { id: FR-SHR-01, was: [REQ-06], module: Media, uc: [UC-SHR-01], text: { vi: "Tải ảnh lên, chuẩn hóa ảnh, xóa thông tin vị trí chụp" } }
  - { id: FR-LST-01, was: [REQ-07], module: Tin đăng, uc: [UC-LST-01], text: { vi: "Đăng tin từ ảnh hoặc video với AI điền giúp; gợi ý giá từ tin tương tự; nháp đồng bộ giữa các máy; đăng lại từ tin cũ" } }
  - { id: FR-LST-02, was: [REQ-08], module: Tin đăng, uc: [UC-LST-02], text: { vi: "Quản lý tin: sửa, đổi giá, ẩn/hiện, đánh dấu đã bán, xóa" } }
  - { id: FR-LST-03, was: [REQ-09], module: Tin đăng, uc: [UC-LST-03], text: { vi: "Đẩy tin và gói người bán" } }
  - { id: FR-LST-04, module: Tin đăng, uc: [UC-LST-04], text: { vi: "Liên kết trang cá nhân Chợ Tốt bằng mã trong phần giới thiệu; mang tin Chợ Tốt sang; đổi giá và ẩn theo Chợ Tốt; nhắc ẩn tin đã bán" } }
  - { id: FR-DSC-01, was: [REQ-10], module: Khám phá, uc: [UC-DSC-01], text: { vi: "Tìm kiếm bằng câu tự nhiên: AI đọc câu của người đã đăng nhập thành điều kiện và trả chip tắt được; khách tìm bằng từ của câu; tìm bằng ảnh; lịch sử tìm" } }
  - { id: FR-DSC-02, was: [REQ-11], module: Khám phá, uc: [UC-DSC-02], text: { vi: "Tìm theo bộ lọc, duyệt danh mục, xem tin tương tự, ẩn tin khỏi kết quả của mình" } }
  - { id: FR-DSC-03, was: [REQ-12], module: Khám phá, uc: [UC-DSC-03, UC-DSC-04], text: { vi: "Lưu tin, báo giảm giá dưới mức đặt, theo dõi người bán" } }
  - { id: FR-DSC-04, module: Khám phá, uc: [UC-DSC-04], text: { vi: "Xem hồ sơ người bán: đánh giá khi bán và khi mua, số liệu, tin đang bán" } }
  - { id: FR-DSC-05, module: Khám phá, uc: [UC-DSC-05], text: { vi: "Trang chủ: tin quanh vị trí, Dành cho bạn theo danh mục con người dùng quan tâm, Vì bạn đã xem gần đây" } }
  - { id: FR-DSC-06, module: Khám phá, uc: [UC-DSC-06], text: { vi: "Theo dõi tìm kiếm: giữ câu tìm kèm bộ lọc và một phường/xã, quét tin mới mỗi 30 phút, đếm và báo tin mới khớp, tắt báo được" } }
  - { id: FR-DEAL-01, was: [REQ-13], module: Trò chuyện, uc: [UC-DEAL-01], text: { vi: "Một cuộc trò chuyện chung cho hai người; nhắn văn bản, ảnh, trích tin; tin nhắn hệ thống cho lượt trả giá và bước của đơn; đã đọc, chưa đọc, lưu trữ, bỏ qua; tìm trong hộp thư; câu trả lời nhanh; báo đang soạn và cập nhật thời gian thực" } }
  - { id: FR-DEAL-02, was: [REQ-14], module: Giao dịch, uc: [UC-DEAL-02], text: { vi: "Phiên trả giá: giá đề nghị, phản giá, chấp nhận giá, từ chối, rút giá, hủy chốt giá theo BR-DEAL-03; tin đổi giá, tắt trả giá, ẩn, bán hoặc xóa thì giá đang mở bị rút" } }
  - { id: FR-DEAL-03, was: [REQ-15], module: "Giao dịch, Vận chuyển", uc: [UC-DEAL-03, UC-DEAL-04, UC-DEAL-06], text: { vi: "Yêu cầu COD; tạo vận đơn GHTK/GHN trên tài khoản người bán; hủy trước khi gửi" } }
  - { id: FR-DEAL-04, was: [REQ-16], module: "Vận chuyển, Giao dịch", uc: [UC-DEAL-05], text: { vi: "Nhận trạng thái vận đơn từ hãng, hỏi lại mỗi 2 giờ; cập nhật đơn, phiên trả giá, tin đăng; tự hoàn tất, tự hủy và đánh dấu giao không thành theo thời hạn" } }
  - { id: FR-SHR-02, was: [REQ-21], module: Thông báo, uc: [UC-SHR-03], text: { vi: "Thông báo trong ứng dụng, thông báo đẩy tới điện thoại và trình duyệt, email cho đơn và tài khoản; công tắc theo loại và giờ yên lặng" } }
  - { id: FR-TRS-01, was: [REQ-17], module: Uy tín, uc: [UC-TRS-01, UC-TRS-05], text: { vi: "Đánh giá hai chiều sau đơn bằng sao, thẻ và ảnh, ẩn tới khi cả hai cùng đánh giá; người được đánh giá trả lời một lần; người đọc đánh dấu đánh giá hữu ích" } }
  - { id: FR-TRS-02, was: [REQ-18], status: retired, module: Uy tín, uc: [UC-TRS-02, UC-TRS-03], text: { vi: "Ghi nhận sự cố kèm nhận xét trung lập của AI" } }
  - { id: FR-TRS-03, was: [REQ-19], module: Uy tín, uc: [UC-DSC-04, UC-TRS-04], text: { vi: "Tính số liệu uy tín: sao trung bình khi bán và khi mua, số món đã bán, tỉ lệ trả lời trong 24 giờ, thời gian thường trả lời, số đơn COD và đơn giao không thành trong 90 ngày" } }
  - { id: FR-TRS-04, module: Uy tín, uc: [UC-DEAL-01], text: { vi: "Cảnh báo dấu hiệu lừa đảo trong cuộc trò chuyện; người dùng tắt được cảnh báo" } }
  - { id: FR-MOD-01, was: [REQ-20], module: "Uy tín, Nhân viên", uc: [UC-MOD-01, UC-MOD-02], text: { vi: "Báo cáo vi phạm; nhân viên xử lý theo ca, ẩn tin và tạm khóa tài khoản" } }
  - { id: FR-MOD-02, was: [REQ-22], module: Nhân viên, uc: [UC-MOD-04, UC-MOD-05, UC-MOD-10, UC-SHR-02], text: { vi: "Quản lý tài khoản nhân viên, đăng nhập riêng vào trang điều hành bằng mật khẩu và TOTP, mở bảng theo dõi vận hành, nhật ký kiểm toán" } }
  - { id: FR-MOD-03, module: "Nhân viên, AI", uc: [UC-MOD-06, UC-MOD-07, UC-MOD-08], text: { vi: "Trợ lý AI của trang điều hành đọc ca báo cáo, phiếu hỗ trợ và tài khoản, trả lời kèm bằng chứng; nhân viên điều khiển lượt chạy (dừng, tiếp tục, gõ thêm chỉ dẫn). Đề xuất thao tác, câu trả lời soạn sẵn và hoàn tác là phần dự kiến (UC-MOD-06, UC-MOD-07)" } }
  - { id: FR-MOD-04, module: Hỗ trợ, uc: [UC-MOD-09, UC-MOD-07], text: { vi: "Phiếu hỗ trợ là một cuộc trò chuyện giữa người dùng và hệ thống; nhân viên trả lời trên trang điều hành" } }
  - { id: FR-MOD-05, module: Góp ý, uc: [UC-MOD-11], text: { vi: "Người dùng gửi góp ý kèm ảnh chụp màn hình; nhân viên gộp góp ý trùng, đặt trạng thái và trả lời, người dùng nhận thông báo đẩy" } }
  - { id: FR-MOD-06, module: "AI, Nhân viên", uc: [UC-MOD-12], text: { vi: "Quản trị viên đặt mô hình, thẻ, giá, ngân sách tháng và giới hạn của từng agent; máy chủ ghi chính sách vào cổng AI" } }

br:
  - { id: BR-ACC-01, was: [BR-20], text: { vi: "Chặn có hiệu lực hai chiều: hai bên không nhắn tin, không mở cuộc trò chuyện, không theo dõi nhau và không mở phiên trả giá trên tin của nhau." } }
  - { id: BR-ACC-02, was: [BR-21], text: { vi: "Không luồng nào tiết lộ một số điện thoại hoặc email đã có tài khoản hay chưa; khi người dùng mở nội dung không thuộc quyền xem của mình, hệ thống trả lời như thể nội dung đó không tồn tại." } }
  - { id: BR-ACC-03, text: { vi: "Tài khoản phải có số điện thoại mới được đăng tin, mở phiên trả giá hoặc mở cuộc trò chuyện." } }
  - { id: BR-ACC-04, text: { vi: "Đăng xuất mọi thiết bị khác, thêm phương thức đăng nhập, gửi mã OTP thêm email và xóa tài khoản cần một lần đăng nhập trong 15 phút gần nhất." } }
  - { id: BR-ACC-05, text: { vi: "Một tài khoản có tối đa một số điện thoại và một email để đăng nhập; mỗi số hoặc email thuộc một tài khoản; hệ thống không gộp tài khoản và không đổi hay gỡ phương thức đăng nhập." } }
  - { id: BR-LST-01, was: [BR-02], text: { vi: "Tin đăng gồm tình trạng hàng theo thang Mới / Như mới / Đã dùng, các thông tin người bán ghi trong tin và ảnh; tin không có phần khai vết, AI không chỉ ra vết nào." } }
  - { id: BR-LST-02, was: [BR-04], text: { vi: "Tài khoản đang bị tạm khóa không được đọc tin bằng AI, xem gợi ý giá, đăng hay sửa tin; vẫn được ẩn, hiện, đánh dấu đã bán, bỏ đánh dấu và xóa tin. Mỗi người bán có tối đa 20 tin đang xử lý, đang bán, đang ẩn, đang giữ chỗ hoặc bị từ chối; bỏ đánh dấu đã bán cũng tính vào trần này." } }
  - { id: BR-LST-03, was: [BR-05], text: { vi: "Tiêu đề 1–70 ký tự; giá nguyên đồng từ 10.000 đến 1.000.000.000; mô tả ≤ 1.500 ký tự; danh mục con; 1–10 ảnh khác nhau, ảnh đầu là ảnh bìa; ≤ 20 thông số, mỗi thông số 1–50 ký tự, đủ các thông số danh mục yêu cầu; vị trí theo phường/xã. Vị trí GPS chỉ gửi khi người bán cho phép, phải cách phường/xã không quá 30 km, được làm nhòe khoảng 1 km trước khi lưu và không bao giờ trả về." } }
  - { id: BR-DSC-01, was: [BR-18], text: { vi: "AI tìm kiếm chỉ đọc câu tìm: không đặt hàng, không trả giá, không nhắn tin thay người dùng; mọi điều kiện AI đặt ra hiện thành chip người dùng tắt được." } }
  - { id: BR-DSC-02, text: { vi: "Tìm kiếm, Trang chủ và lần quét tìm kiếm theo dõi chỉ có tin đang bán; với người đã đăng nhập, chúng bỏ các tin người đó đã ẩn khỏi kết quả và tin của mọi người có chặn với người đó, theo cả hai chiều." } }
  - { id: BR-DSC-03, text: { vi: "Mỗi tài khoản lưu tối đa 500 tin, theo dõi tối đa 20 câu tìm, giữ 1.000 tin ẩn khỏi kết quả và 10 câu tìm gần nhất; câu tìm của một người được mô hình đọc tối đa 200 lần mỗi ngày (giờ UTC)." } }
  - { id: BR-DEAL-01, was: [BR-01], text: { vi: "Hệ thống không giữ tiền: không ví, không cọc, không thu hộ, không hoàn tiền qua hệ thống." } }
  - { id: BR-DEAL-02, was: [BR-03], text: { vi: "Người mua tự xem hàng khi đồng kiểm tại cửa rồi nhận hoặc từ chối; ứng dụng không gợi ý cần kiểm gì." } }
  - { id: BR-DEAL-03, was: [BR-06], text: { vi: "Mọi mức giá trong phiên trả giá là bội số 1.000 đ; người mua chỉ đưa giá đề nghị khi tin cho phép trả giá; giá đề nghị ≥ nửa giá niêm yết (làm tròn lên 1.000) và thấp hơn giá niêm yết hoặc phản giá; phản giá cao hơn giá đề nghị và thấp hơn giá niêm yết; mỗi thời điểm chỉ một giá đang mở, giá mở không hết hạn; chấp nhận phải đúng giá mà người chấp nhận đang thấy, nếu giá vừa bị đổi thì lượt chấp nhận bị từ chối và ứng dụng báo giá đã thay đổi." } }
  - { id: BR-DEAL-04, was: [BR-07], text: { vi: "Chốt giá không giữ hàng; nhiều người mua có thể cùng chốt một tin; khi người bán gửi hàng cho một người, các yêu cầu COD khác trên tin tự hủy với lý do \"đã gửi cho người khác\"." } }
  - { id: BR-DEAL-05, was: [BR-08], text: { vi: "COD đồng kiểm qua GHTK hoặc GHN trên tài khoản của người bán là đường giao dịch duy nhất trong ứng dụng; vận đơn thu hộ tiền hàng và đặt người nhận trả phí vận chuyển; người mua chỉ trả tiền sau khi xem hàng." } }
  - { id: BR-DEAL-06, was: [BR-09], text: { vi: "Một người mua có tối đa 3 đơn COD đang mở (chờ tạo đơn hoặc đã gửi)." } }
  - { id: BR-DEAL-07, was: [BR-10], text: { vi: "Người mua hoặc người bán hủy được đơn khi người bán chưa gửi; người bán không gửi trong 3 ngày thì đơn tự hủy; hãng chưa lấy hàng 3 ngày sau khi gửi thì đơn bị hủy và vận đơn trên tài khoản hãng bị hủy theo." } }
  - { id: BR-DEAL-08, was: [BR-11], text: { vi: "Từ chối nhận tại cửa: người mua không mất tiền; phí hai chiều do hãng tính vào tài khoản người bán; tin đăng mở bán lại." } }
  - { id: BR-DEAL-09, was: [BR-12], text: { vi: "Sau khi người mua đã trả tiền cho shipper, hệ thống không có cơ chế đòi lại; Trợ giúp ghi điều này, màn nhận hàng không nhắc." } }
  - { id: BR-DEAL-11, text: { vi: "Đơn hoàn tất khi người mua bấm đã nhận hàng, hoặc 3 ngày sau khi hãng báo đã giao. Hãng báo hoàn hàng, làm mất hàng sau khi lấy, hoặc 30 ngày sau khi lấy hàng mà không còn biết vận đơn thì đơn giao không thành; một lần giao không được thì hãng giao lại, đơn vẫn đang giao. Hàng thất lạc là lỗi của hãng: không tính cho người mua hay người bán, đơn không được đánh giá, tin bị ẩn cho người bán tự hiện lại." } }
  - { id: BR-DEAL-12, status: retired, text: { vi: "Mã vận đơn người bán nhập tay phải thuộc tài khoản GHTK/GHN mà người bán đã liên kết; hãng khác được xin thêm qua phiếu hỗ trợ." } }
  - { id: BR-DEAL-10, was: [BR-13], status: retired, text: { vi: "Món giá trên 5.000.000 đ: ứng dụng gợi ý hẹn gặp xem hàng trước, vẫn cho chọn COD." } }
  - { id: BR-TRS-01, was: [BR-14], status: retired, text: { vi: "Ghi nhận sự cố không được phân xử; người bán trả lời trong 3 ngày bằng tự hoàn hoặc từ chối; ghi nhận bị từ chối hoặc quá hạn hiển thị công khai trên hồ sơ người bán." } }
  - { id: BR-TRS-02, was: [BR-15], status: retired, text: { vi: "Chế tài tự động chỉ xét khi có ≥ 5 đơn COD trong 90 ngày; tỉ lệ từ chối nhận ≥ 20% thì giới hạn còn 1 đơn COD mở, ≥ 35% thì mất quyền COD 30 ngày; mỗi 30 ngày không có lần từ chối nào hồi lại một nấc; đơn tự gửi không tính vào tỉ lệ." } }
  - { id: BR-TRS-03, was: [BR-16], status: retired, text: { vi: "Điểm uy tín 0–1000 tính theo bảng sự kiện; quyền COD và bậc uy tín không mua được bằng gói trả phí." } }
  - { id: BR-TRS-04, was: [BR-17], text: { vi: "Sau khi đơn hoàn tất hoặc giao không thành (trừ khi hãng làm mất hàng), người mua và người bán đánh giá nhau mỗi người một lần (1–5 sao, ≤ 500 ký tự, thẻ theo vai của người được đánh giá, ≤ 4 ảnh); đánh giá ẩn cho đến khi bên kia cũng đánh giá hoặc 7 ngày sau khi đơn đóng; người viết sửa hoặc xóa được khi đánh giá còn ẩn và chưa quá 7 ngày từ lần gửi đầu; người được đánh giá trả lời một lần (≤ 500 ký tự) khi đánh giá đã hiện, sau đó đánh giá khóa lại." } }
  - { id: BR-TRS-05, text: { vi: "Uy tín hiển thị bằng số liệu quan sát được, không có điểm hay bậc; hạn mức như nhau cho mọi tài khoản và không mua được bằng gói trả phí; tỉ lệ trả lời chỉ tính khi có từ 5 cuộc trò chuyện trong 90 ngày." } }
  - { id: BR-TRS-06, text: { vi: "Cảnh báo lừa đảo cần ít nhất một dấu hiệu trong tin nhắn; số điện thoại, số tài khoản, số thẻ, email và link được che trước khi AI đọc; cảnh báo đã tắt hiện lại khi có dấu hiệu mới." } }
  - { id: BR-MOD-01, was: [BR-19], text: { vi: "Nhân viên chỉ xử lý phiếu hỗ trợ, hàng cấm và hàng giả bị báo cáo, lừa đảo có tổ chức và yêu cầu của cơ quan có thẩm quyền; giá và tình trạng hàng là việc giữa hai bên." } }
  - { id: BR-MOD-02, text: { vi: "Tài khoản đang bị tạm khóa vẫn đăng nhập và giữ phiên, nhưng ứng dụng chỉ cho xem lý do, ngày hết tạm khóa, liên hệ hỗ trợ và đăng xuất. Tài khoản không ghi được gì mới: đăng hay sửa tin, nhắn tin, trả giá, chấp nhận giá, yêu cầu COD, viết, xóa hay đánh dấu đánh giá, báo cáo hay rút báo cáo, theo dõi, sửa hồ sơ, thêm định danh hay xóa tài khoản. Vẫn được rút giá, từ chối, hủy đơn, gửi phiếu hỗ trợ và nhắn trong phiếu." } }
  - { id: BR-MOD-03, text: { vi: "Trợ lý AI của trang điều hành chỉ đọc và đề xuất; mọi thay đổi do nhân viên bấm và được ghi nhật ký kiểm toán; tin nhắn gửi cho người dùng luôn mang tên chung của hệ thống." } }
  - { id: BR-MOD-04, text: { vi: "Quản trị viên chỉ được tạo và quản lý bằng công cụ dòng lệnh của máy chủ; trang điều hành chỉ quản lý điều phối viên." } }
  - { id: BR-SHR-01, text: { vi: "Công tắc tắt chỉ chặn thông báo đẩy hoặc email của loại đó; thông báo vẫn nằm trong danh sách. Thông báo về tin lên sàn hay bị từ chối, tài khoản, góp ý và Chợ Tốt không có công tắc; tìm kiếm theo dõi đẩy theo chuông riêng của từng tìm kiếm. Trong giờ yên lặng (giờ Việt Nam, giờ bắt đầu khác giờ kết thúc) không thông báo đẩy nào đi và thông báo bị bỏ chứ không đẩy sau. Email đơn hàng có công tắc riêng, email tạm khóa và mở khóa tài khoản luôn gửi; email không theo giờ yên lặng." } }
  - { id: BR-SHR-02, text: { vi: "Mỗi người nhận có tối đa một thông báo chưa đọc về một thứ (một cuộc giao dịch, một tin, một người bán đang theo dõi, một tìm kiếm theo dõi, một tin đã lưu, một góp ý); thông báo không được cập nhật trong 90 ngày bị xóa." } }

nfr:
  - { id: NFR-DUR-01, was: [NFR-01], attr: Độ bền, text: { vi: "Máy chủ gặp sự cố giữa một quy trình nhiều bước không để lại dữ liệu dở dang; quy trình chạy tiếp từ bước đã xong và không lặp việc đã làm (không tạo hai vận đơn, không gửi hai email mã OTP)." } }
  - { id: NFR-IDEM-01, was: [NFR-02], attr: Không lặp khi gửi lại, text: { vi: "Một thao tác được ứng dụng gửi lại vì mạng chập chờn cho đúng kết quả của lần đầu; hãng báo trùng một trạng thái thì đơn không đổi trạng thái hai lần." } }
  - { id: NFR-CONC-01, was: [NFR-03], attr: Nhất quán khi đồng thời, text: { vi: "Hai người cùng sửa một dữ liệu thì người sửa sau được báo dữ liệu đã thay đổi thay vì ghi đè; các hạn mức (số đơn COD đang mở, số tin đang bán) vẫn đúng khi nhiều yêu cầu đến cùng lúc." } }
  - { id: NFR-MSG-01, was: [NFR-04], attr: Không mất thông báo giữa các module, text: { vi: "Thông báo cho các module khác được ghi cùng lúc với thay đổi dữ liệu; khi phần điều phối quy trình tạm ngừng, thông báo được giữ lại và gửi sau, người dùng vẫn xem được dữ liệu và giữ được phiên đăng nhập." } }
  - { id: NFR-PERF-01, was: [NFR-05], attr: Hiệu năng, text: { vi: "95% lượt xem dữ liệu trả về dưới 300 ms; 95% lượt tìm kiếm có câu đã đọc trả về dưới 800 ms; mô hình đọc câu quá 4 giây thì hệ thống tìm bằng câu gốc." } }
  - { id: NFR-SEC-01, was: [NFR-06], attr: An toàn xác thực, text: { vi: "Phiên đăng nhập ngắn hạn sống 15 phút và được làm mới tự động; mã làm mới bị dùng lại thì phiên bị thu hồi; có hạn mức gửi OTP; không lộ việc một số điện thoại hay email đã có tài khoản." } }
  - { id: NFR-PRIV-01, was: [NFR-07], attr: Quyền riêng tư, text: { vi: "Xóa thông tin vị trí chụp khỏi ảnh; vị trí tin theo phường/xã; che số điện thoại, email trong nhật ký; mã hóa khóa kết nối tài khoản hãng vận chuyển của người bán." } }
  - { id: NFR-OBS-01, was: [NFR-08], attr: Quan trắc, text: { vi: "Mọi yêu cầu được theo vết; thông báo lỗi mang mã tra cứu để đối chiếu nhật ký; có số liệu đăng nhập, gửi OTP và thông báo đã gửi giữa các module." } }
  - { id: NFR-PERF-02, attr: Hiệu năng, text: { vi: "Một lượt hỏi trợ lý AI của trang điều hành trả lời trong 60 giây; quá hạn thì lượt dừng, giữ phần đã làm, nhân viên bấm Tiếp tục để chạy tiếp. Đóng trang thì lượt vẫn chạy trên máy chủ." } }
  - { id: NFR-PRIV-02, attr: Quyền riêng tư, text: { vi: "Mỗi lần trợ lý AI của trang điều hành đọc dữ liệu cá nhân được ghi lại kèm nhân viên đã hỏi; cuộc trò chuyện với trợ lý AI giữ 180 ngày; xóa tài khoản thì xóa các phần trích dữ liệu của tài khoản đó." } }
  - { id: NFR-API-01, was: [NFR-09], attr: Tuân thủ hợp đồng API, text: { vi: "Mọi yêu cầu được kiểm theo đặc tả API; bộ kiểm thử đầu-cuối gặp đủ mọi kết quả trả về đã khai trong đặc tả." } }
  - { id: NFR-ARCH-01, was: [NFR-10], attr: Khả năng tách module, text: { vi: "Mỗi module chỉ cho module khác dùng qua giao diện đã công bố; tách ra chạy riêng không phải sửa nghiệp vụ." } }
  - { id: NFR-UX-01, was: [NFR-11], attr: Ứng dụng di động, text: { vi: "Ứng dụng chạy trên Android 12 trở lên, có giao diện tối, cỡ chữ 130%, vùng chạm tối thiểu 48 dp; website dùng được ở bề rộng điện thoại." } }

adr:
  - id: ADR-0001
    status: accepted
    title: { vi: "Hệ thống không giữ tiền, giao dịch bằng COD qua tài khoản hãng của người bán", en: "No money held; COD through the seller's own carrier account" }
    text: { vi: "Vận đơn được tạo trên tài khoản GHTK/GHN của chính người bán; tiền hàng do hãng thu hộ trả thẳng cho người bán. Hệ thống không có ví, không cọc, không hoàn tiền, nên cũng không phải phân xử ai được nhận tiền (BR-DEAL-01)." }
  - id: ADR-0002
    status: accepted
    title: { vi: "Quy trình nhiều bước chạy trên Restate", en: "Multi-step flows run on Restate" }
    text: { vi: "Mỗi quy trình gọi ra ngoài nhiều bước (giữ tin, tạo vận đơn, lưu đơn) là một service Restate: từng bước được ghi lại, máy chủ chết giữa chừng thì chạy tiếp từ bước đã xong. Mỗi dòng dữ liệu một quy trình tạo ra có khóa chống trùng riêng, nên gửi lại cùng yêu cầu thì nhận đúng kết quả lần đầu (NFR-DUR-01, NFR-IDEM-01). Các thao tác chỉ đọc hoặc ghi một lần chạy thẳng, không qua Restate, nên vẫn dùng được khi Restate tạm ngừng (NFR-MSG-01)." }
  - id: ADR-0003
    status: accepted
    title: { vi: "Trợ lý AI của trang điều hành chạy riêng, đọc qua MCP của máy chủ", en: "The console agent runs apart and reads through the server's MCP" }
    text: { vi: "Vòng lặp của trợ lý AI là dịch vụ riêng (shopnexus/agent) trong mạng nội bộ; trang điều hành chỉ gọi máy chủ, máy chủ kiểm phiên rồi chuyển tiếp. Trợ lý AI lấy dữ liệu qua MCP của máy chủ, chỉ có công cụ đọc; mọi thao tác ghi đi qua các endpoint của trang điều hành có nhật ký kiểm toán (BR-MOD-03). Việc chạy nền do Restate của máy chủ gọi trợ lý AI (ADR-0002)." }
  - id: ADR-0004
    status: accepted
    title: { vi: "Mọi lời gọi mô hình AI đi qua một cổng AI", en: "Every model call goes through one AI gateway" }
    text: { vi: "Máy chủ và trợ lý AI không gọi thẳng nhà cung cấp mô hình mà gọi qua cổng AI (Bifrost) của hệ thống. Mỗi bên gọi có khóa ảo riêng với hạn mức chi tiêu; máy chủ tự tạo khóa, giá và danh sách mô hình dự phòng trong cổng từ phần Cài đặt AI của trang điều hành. Hết hạn mức hay nhà cung cấp lỗi thì từng tính năng tự lùi về cách làm không cần AI hoặc báo tạm ngừng, không làm hỏng luồng chính." }
  - id: ADR-0005
    status: accepted
    title: { vi: "Máy chủ là một khối gồm nhiều module tách biệt", en: "The server is a modular monolith" }
    text: { vi: "Máy chủ là một chương trình duy nhất chia thành các module; mỗi module giữ bảng của mình và chỉ cho module khác gọi qua giao diện dịch vụ, một bài kiểm thử chặn mọi lối tắt (NFR-ARCH-01). Một nhóm nhỏ triển khai và kiểm thử một khối dễ hơn nhiều dịch vụ, mà vẫn tách được một module ra chạy riêng khi cần." }
