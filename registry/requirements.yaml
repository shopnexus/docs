    was: [UC-16]
    status: done
    title: { vi: "Tạo đơn gửi hàng (vận đơn GHTK/GHN hoặc tự gửi)", en: "Ship an order (GHTK/GHN waybill or manual)" }
    short: { vi: "Tạo đơn gửi hàng" }
    actors: [seller]
    secondary: [carrier]
    fr: [FR-DEAL-03]
    br: [BR-DEAL-04, BR-DEAL-05]
    nfr: [NFR-DUR-01, NFR-IDEM-01, NFR-CONC-01]
    adr: [ADR-0001, ADR-0002]
    api: ["POST /v1/orders/{order_id}/shipment", "PUT /v1/orders/{order_id}/shipment", "GET /v1/shipments/lookup"]
    pre: Có đơn đang chờ gửi; muốn tạo vận đơn qua hãng thì người bán đã liên kết hãng (UC-ACC-04).
    post: Đơn ở trạng thái đã gửi, tin đăng được giữ cho đơn này; các đơn chờ khác trên tin bị hủy.
    main:
      1: Người bán chọn tạo vận đơn qua hãng đã liên kết, hoặc tự gửi và nhập hãng cùng mã vận đơn.
      2: Hệ thống giữ tin đăng cho đơn.
      3: Hệ thống tạo vận đơn trên tài khoản hãng của người bán, người nhận trả phí ship; với đơn tự gửi, hệ thống đọc vận đơn từ hãng.
      4: Đơn chuyển sang đã gửi; các đơn chờ khác trên tin tự hủy với lý do "đã gửi cho người khác".
      5: Hệ thống bắt đầu đếm thời hạn hãng lấy hàng và theo dõi trạng thái vận đơn.
    alt:
      A1: { at: 1, text: "Ứng dụng gửi lại cùng một yêu cầu: trả đúng kết quả lần đầu, không tạo thêm vận đơn." }
      A2: { at: 4, text: "Hãng báo vận đơn tự gửi đã giao: hệ thống hẹn giờ tự hoàn tất đơn." }
      A3: { at: 5, text: "Người bán sửa hãng hoặc mã vận đơn của đơn tự gửi khi hàng chưa giao." }
    exc:
      E1: { at: 3, text: Hãng không biết mã vận đơn, error: shipment_not_found }
      E2: { at: 1, text: Hệ thống không bật hãng vận chuyển nào, error: carrier_unavailable }
      E3: { at: 1, text: Người bán chưa liên kết hãng, error: carrier_not_linked }
      E4: { at: 3, text: Hãng không giao tới địa chỉ; tin đăng được trả lại, error: carrier_address_unknown }
      E5: { at: 2, text: Tin không còn đang bán, error: listing_unavailable }
      E6: { at: 3, text: Vận đơn sai quy tắc hoặc hãng báo vận đơn hỏng, error: invalid_shipment }
      E7: { at: 4, text: "Đơn bị hủy cùng lúc: tin đăng được trả lại, vận đơn vừa tạo bị hủy trên hãng", nfr: NFR-CONC-01 }
      E8: { at: 1, text: Đơn không còn chờ gửi hoặc không phải của người bán, error: move_not_allowed }

  - id: UC-DEAL-05
    was: [UC-17]
    status: done
    title: { vi: "Theo dõi đơn và nhận hàng đồng kiểm (nhận hoặc từ chối tại cửa)", en: "Track an order and inspect on delivery" }
    short: { vi: "Theo dõi đơn và nhận hàng đồng kiểm" }
    actors: [buyer]
    actorsNote: hãng vận chuyển báo trạng thái
    secondary: [carrier]
    fr: [FR-DEAL-04]
    br: [BR-DEAL-02, BR-DEAL-05, BR-DEAL-07, BR-DEAL-08, BR-DEAL-09, BR-TRS-02]
    nfr: [NFR-IDEM-01, NFR-DUR-01]
    api: ["POST /v1/orders/{order_id}/confirm", "POST /v1/carriers/{carrier}/webhook/{secret}"]
    pre: "UC-DEAL-04 đã hoàn tất: đơn ở trạng thái đã tạo vận đơn, vận đơn GHTK/GHN nằm trên tài khoản người bán (đơn tự gửi xem A2); người mua đã thấy phí ship thật."
    post: "Nhận: đơn đã giao, tin và thương lượng đã bán, mở UC-TRS-01, UC-TRS-02. Từ chối: đơn đã hoàn, tin về đang bán, thương lượng về đang thương lượng. Phân hệ uy tín cập nhật điểm và tỉ lệ từ chối nhận."
    main:
      1: Hãng lấy hàng và báo trạng thái về hệ thống; đơn chuyển sang đang giao; ứng dụng cập nhật màn hình đơn ngay và gửi thông báo đẩy.
      2: Khi shipper tới cửa, ứng dụng hiện tờ "Tin ghi" (tình trạng và các thông tin người bán ghi trong tin) và cảnh báo rằng sau khi trả tiền sàn không có cơ chế đòi lại.
      3: Người mua xem hàng, đối chiếu với tin ghi, đồng ý nhận và trả tiền hàng cùng phí ship chiều đi cho shipper.
      4: Hãng báo giao thành công; hệ thống chuyển đơn sang đã giao, đánh dấu tin đã bán và đóng thương lượng.
    alt:
      A1: { at: 4, text: "Hãng báo lặp cùng một trạng thái của cùng một vận đơn: hệ thống chỉ ghi nhận lần đầu, đơn không đổi trạng thái hai lần.", nfr: NFR-IDEM-01 }
      A2: { at: 4, text: "Đơn tự gửi, hoặc người mua xác nhận trước khi hãng báo: người mua báo đã nhận, đơn đã giao; đơn tự gửi không tính vào tỉ lệ chế tài." }
      A3: { at: 4, text: "Sau khi nhận, người mua phát hiện sự cố mà lúc xem tại cửa không thấy: người mua mở UC-TRS-02." }
      A4: { at: 4, text: "Hãng báo đã giao mà người mua không xác nhận: hết thời hạn, hệ thống tự hoàn tất đơn." }
    exc:
      E1: { at: 1, text: "Trước khi hãng lấy hàng, một bên hủy đơn (UC-DEAL-06): đơn chuyển sang đã hủy." }
      E2: { at: 3, text: "Hàng không khớp tin ghi: người mua từ chối nhận, không trả đồng nào; hãng hoàn hàng, báo đã hoàn, tính phí hai chiều vào tài khoản người bán.", br: BR-DEAL-08 }
      E3: { at: 4, text: Đơn không còn ở trạng thái đã gửi, error: move_not_allowed }
    gaps:
      - Người mua báo "không nhận được" với đơn tự gửi chưa có trong code.

