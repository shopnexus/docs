  - { id: FR-DEAL-01, was: [REQ-13], module: Trò chuyện, uc: [UC-DEAL-01], text: { vi: "Nhắn tin văn bản và ảnh, đánh dấu đã đọc, tìm trong hộp thư, cập nhật thời gian thực" } }
  - { id: FR-DEAL-02, was: [REQ-14], module: Giao dịch, uc: [UC-DEAL-02], text: { vi: "Thương lượng giá theo BR-DEAL-03" } }
  - { id: FR-DEAL-03, was: [REQ-15], module: "Giao dịch, Vận chuyển", uc: [UC-DEAL-03, UC-DEAL-04, UC-DEAL-06], text: { vi: "Yêu cầu COD; tạo vận đơn GHTK/GHN trên tài khoản người bán hoặc nhập mã; hủy trước khi gửi" } }
  - { id: FR-DEAL-04, was: [REQ-16], module: "Vận chuyển, Giao dịch", uc: [UC-DEAL-05], text: { vi: "Nhận trạng thái vận đơn từ hãng, hỏi lại mỗi 2 giờ; cập nhật đơn, thương lượng, tin đăng; tự hoàn tất và tự hủy theo thời hạn" } }
  - { id: FR-TRS-01, was: [REQ-17], module: Uy tín, uc: [UC-TRS-01], text: { vi: "Đánh giá hai chiều sau đơn, người được đánh giá trả lời một lần" } }
  - { id: FR-TRS-02, was: [REQ-18], status: retired, module: Uy tín, uc: [UC-TRS-02, UC-TRS-03], text: { vi: "Ghi nhận sự cố kèm nhận xét trung lập của AI" } }
  - { id: FR-TRS-03, was: [REQ-19], module: Uy tín, uc: [UC-DSC-04, UC-TRS-04], text: { vi: "Tính số liệu uy tín: sao trung bình khi bán và khi mua, số món đã bán, tỉ lệ trả lời trong 24 giờ, đơn giao không thành trong 90 ngày" } }
  - { id: FR-TRS-04, module: Uy tín, uc: [UC-DEAL-01], text: { vi: "Cảnh báo dấu hiệu lừa đảo trong trò chuyện; người dùng tắt được cảnh báo" } }
  - { id: FR-MOD-01, was: [REQ-20], module: "Uy tín, Nhân viên", uc: [UC-MOD-01, UC-MOD-02], text: { vi: "Báo cáo vi phạm; nhân viên xử lý và tạm khóa tài khoản" } }
  - { id: FR-SHR-02, was: [REQ-21], module: Thông báo, uc: [UC-DEAL-02, UC-DEAL-03, UC-DEAL-04, UC-DEAL-05, UC-DEAL-06, UC-TRS-01], ucText: UC-DEAL-02 – UC-TRS-01, text: { vi: "Thông báo trong ứng dụng và đẩy tới điện thoại; công tắc theo loại và giờ yên lặng" } }
  - { id: FR-MOD-02, was: [REQ-22], module: Nhân viên, uc: [UC-MOD-04, UC-MOD-05, UC-SHR-02], text: { vi: "Quản lý thành viên console, đăng nhập riêng cho nhân viên, nhật ký kiểm toán" } }
  - { id: FR-MOD-03, module: "Nhân viên, AI", uc: [UC-MOD-06, UC-MOD-07, UC-MOD-08], text: { vi: "Agent của console đọc ca báo cáo và ticket, trình bằng chứng, đề xuất thao tác và soạn câu trả lời; nhân viên duyệt, sửa bằng tick hoặc chat, làm theo và hoàn tác" } }
  - { id: FR-MOD-04, module: Hỗ trợ, uc: [UC-MOD-09, UC-MOD-07], text: { vi: "Phiếu hỗ trợ là một cuộc trò chuyện giữa người dùng và sàn; nhân viên trả lời trên console" } }

br:
  - { id: BR-DEAL-01, was: [BR-01], text: { vi: "Sàn không giữ tiền: không ví, không cọc, không thu hộ, không hoàn tiền qua sàn." } }
  - { id: BR-LST-01, was: [BR-02], text: { vi: "Tin đăng gồm tình trạng hàng theo thang Mới / Như mới / Đã dùng, các thông tin người bán ghi trong tin và ảnh; tin không có phần khai vết, AI không chỉ ra vết nào." } }
  - { id: BR-DEAL-02, was: [BR-03], text: { vi: "Người mua tự xem hàng khi đồng kiểm tại cửa rồi nhận hoặc từ chối; ứng dụng không gợi ý cần kiểm gì." } }
  - { id: BR-LST-02, was: [BR-04], text: { vi: "Chỉ tài khoản có số điện thoại đã xác minh và không bị tạm khóa mới được đăng tin; mỗi người có tối đa 20 tin đang bán." } }
  - { id: BR-LST-03, was: [BR-05], text: { vi: "Tiêu đề 1–70 ký tự; giá nguyên đồng từ 10.000 đến 1.000.000.000; mô tả ≤ 1.500 ký tự; 1–10 ảnh, ảnh đầu là ảnh bìa; ≤ 20 thông số; vị trí lưu theo phường/xã (tọa độ tâm xã), không lưu GPS của người bán." } }
  - { id: BR-DEAL-03, was: [BR-06], text: { vi: "Giá thương lượng là bội số 1.000 đ; giá trả ≥ nửa giá niêm yết (làm tròn lên 1.000) và thấp hơn giá niêm yết hoặc phản giá; phản giá cao hơn giá trả và thấp hơn giá niêm yết; mỗi thời điểm chỉ một giá đang mở, giá mở không hết hạn; chấp nhận phải đúng giá mà người chấp nhận đang thấy, nếu giá vừa bị đổi thì lượt chấp nhận bị từ chối và ứng dụng báo giá đã thay đổi." } }
  - { id: BR-DEAL-04, was: [BR-07], text: { vi: "Chốt giá không giữ hàng; nhiều người mua có thể cùng chốt một tin; khi người bán gửi hàng cho một người, các yêu cầu COD khác trên tin tự hủy với lý do \"đã gửi cho người khác\"." } }
  - { id: BR-DEAL-05, was: [BR-08], text: { vi: "COD đồng kiểm qua GHTK hoặc GHN trên tài khoản của người bán là đường giao dịch duy nhất trong ứng dụng; vận đơn thu hộ tiền hàng và đặt người nhận trả phí ship; người mua chỉ trả tiền sau khi xem hàng." } }
  - { id: BR-DEAL-06, was: [BR-09], text: { vi: "Một người mua có tối đa 3 đơn COD đang mở." } }
  - { id: BR-DEAL-07, was: [BR-10], text: { vi: "Người mua hoặc người bán hủy được đơn khi người bán chưa gửi; người bán không gửi trong 3 ngày thì đơn tự hủy; hãng chưa lấy hàng 3 ngày sau khi gửi thì đơn bị hủy và vận đơn trên tài khoản hãng bị hủy theo." } }
  - { id: BR-DEAL-08, was: [BR-11], text: { vi: "Từ chối nhận tại cửa: người mua không mất tiền; phí hai chiều do hãng tính vào tài khoản người bán; tin đăng mở bán lại." } }
  - { id: BR-DEAL-09, was: [BR-12], text: { vi: "Sau khi người mua đã trả tiền cho shipper, sàn không có cơ chế đòi lại; Trợ giúp ghi điều này, màn nhận hàng không nhắc." } }
  - { id: BR-DEAL-11, text: { vi: "Đơn hoàn tất khi người mua bấm đã nhận hàng, hoặc 3 ngày sau khi hãng báo đã giao; hãng báo không giao được hoặc hoàn hàng thì đơn giao không thành." } }
  - { id: BR-DEAL-12, text: { vi: "Mã vận đơn người bán nhập tay phải thuộc tài khoản GHTK/GHN mà người bán đã liên kết; hãng khác được xin thêm qua phiếu hỗ trợ." } }
  - { id: BR-DEAL-10, was: [BR-13], status: retired, text: { vi: "Món giá trên 5.000.000 đ: ứng dụng gợi ý hẹn gặp xem hàng trước, vẫn cho chọn COD." } }
  - { id: BR-TRS-01, was: [BR-14], status: retired, text: { vi: "Ghi nhận sự cố không được phân xử; người bán trả lời trong 3 ngày bằng tự hoàn hoặc từ chối; ghi nhận bị từ chối hoặc quá hạn hiển thị công khai trên hồ sơ người bán." } }
  - { id: BR-TRS-02, was: [BR-15], status: retired, text: { vi: "Chế tài tự động chỉ xét khi có ≥ 5 đơn COD trong 90 ngày; tỉ lệ từ chối nhận ≥ 20% thì giới hạn còn 1 đơn COD mở, ≥ 35% thì mất quyền COD 30 ngày; mỗi 30 ngày không có lần từ chối nào hồi lại một nấc; đơn tự gửi không tính vào tỉ lệ." } }
  - { id: BR-TRS-03, was: [BR-16], status: retired, text: { vi: "Điểm uy tín 0–1000 tính theo bảng sự kiện; quyền COD và bậc uy tín không mua được bằng gói trả phí." } }
  - { id: BR-TRS-04, was: [BR-17], text: { vi: "Sau khi đơn hoàn tất, người mua và người bán đánh giá nhau mỗi người một lần (1–5 sao, ≤ 500 ký tự); đánh giá ẩn cho đến khi bên kia cũng đánh giá hoặc qua 7 ngày; người được đánh giá trả lời một lần (≤ 500 ký tự), sau đó đánh giá khóa lại; trước khi có câu trả lời, người viết sửa hoặc xóa được trong 7 ngày." } }
  - { id: BR-TRS-05, text: { vi: "Uy tín hiển thị bằng số liệu quan sát được, không có điểm hay bậc; hạn mức như nhau cho mọi tài khoản và không mua được bằng gói trả phí; tỉ lệ trả lời chỉ tính khi có từ 5 cuộc trò chuyện trong 90 ngày." } }
  - { id: BR-TRS-06, text: { vi: "Cảnh báo lừa đảo cần ít nhất một dấu hiệu trong tin nhắn; số điện thoại, số tài khoản, số thẻ, email và link được che trước khi AI đọc; cảnh báo đã tắt hiện lại khi có dấu hiệu mới." } }
  - { id: BR-DSC-01, was: [BR-18], text: { vi: "AI tìm kiếm chỉ đọc câu tìm: không đặt hàng, không thương lượng, không nhắn tin thay người dùng; mọi điều kiện AI đặt ra hiện thành chip người dùng tắt được." } }
  - { id: BR-MOD-01, was: [BR-19], text: { vi: "Nhân viên chỉ xử lý phiếu hỗ trợ, hàng cấm và hàng giả bị báo cáo, lừa đảo có tổ chức và yêu cầu của cơ quan có thẩm quyền; giá và tình trạng hàng là việc giữa hai bên." } }
  - { id: BR-ACC-01, was: [BR-20], text: { vi: "Chặn có hiệu lực hai chiều: hai bên không nhắn tin, không mở thương lượng trên tin của nhau." } }
  - { id: BR-ACC-02, was: [BR-21], text: { vi: "Không luồng nào tiết lộ một số điện thoại hoặc email đã có tài khoản hay chưa; khi người dùng mở nội dung không thuộc quyền xem của mình, hệ thống trả lời như thể nội dung đó không tồn tại." } }
  - { id: BR-ACC-03, text: { vi: "Tài khoản phải có số điện thoại mới được đăng tin, mở thương lượng hoặc mở cuộc trò chuyện." } }
  - { id: BR-MOD-02, text: { vi: "Tài khoản đang bị tạm khóa không được trả giá, chấp nhận giá hay yêu cầu COD; vẫn được rút giá, từ chối và hủy." } }
  - { id: BR-MOD-03, text: { vi: "Agent của console chỉ đọc và đề xuất; mọi thay đổi do nhân viên bấm và được ghi nhật ký thao tác; tin nhắn gửi cho người dùng luôn mang tên chung của sàn." } }

nfr:
  - { id: NFR-DUR-01, was: [NFR-01], attr: Độ bền, text: { vi: "Máy chủ gặp sự cố giữa một quy trình nhiều bước không để lại dữ liệu dở dang; quy trình chạy tiếp từ bước đã xong và không lặp việc đã làm (không tạo hai vận đơn, không gửi hai email mã đăng nhập)." } }
  - { id: NFR-IDEM-01, was: [NFR-02], attr: Không lặp khi gửi lại, text: { vi: "Một thao tác được ứng dụng gửi lại vì mạng chập chờn cho đúng kết quả của lần đầu; hãng báo trùng một trạng thái thì đơn không đổi trạng thái hai lần." } }
  - { id: NFR-CONC-01, was: [NFR-03], attr: Nhất quán khi đồng thời, text: { vi: "Hai người cùng sửa một dữ liệu thì người sửa sau được báo dữ liệu đã thay đổi thay vì ghi đè; các hạn mức (số đơn COD đang mở, số tin đang bán) vẫn đúng khi nhiều yêu cầu đến cùng lúc." } }
  - { id: NFR-MSG-01, was: [NFR-04], attr: Không mất thông báo giữa phân hệ, text: { vi: "Thông báo cho các phân hệ khác được ghi cùng lúc với thay đổi dữ liệu; khi phần điều phối quy trình tạm ngừng, thông báo được giữ lại và gửi sau, người dùng vẫn xem được dữ liệu và giữ được phiên đăng nhập." } }
  - { id: NFR-PERF-01, was: [NFR-05], attr: Hiệu năng, text: { vi: "95% lượt xem dữ liệu trả về dưới 300 ms; 95% lượt tìm kiếm có câu đã đọc trả về dưới 800 ms; mô hình đọc câu quá 4 giây thì hệ thống tìm bằng câu gốc." } }
  - { id: NFR-SEC-01, was: [NFR-06], attr: An toàn xác thực, text: { vi: "Phiên đăng nhập ngắn hạn sống 15 phút và được làm mới tự động; mã làm mới bị dùng lại thì phiên bị thu hồi; có hạn mức gửi OTP; không lộ việc một số điện thoại hay email đã có tài khoản." } }
  - { id: NFR-PRIV-01, was: [NFR-07], attr: Quyền riêng tư, text: { vi: "Xóa thông tin vị trí chụp khỏi ảnh; vị trí tin theo xã; che số điện thoại, email trong nhật ký; mã hóa khóa kết nối tài khoản hãng vận chuyển của người bán." } }
  - { id: NFR-OBS-01, was: [NFR-08], attr: Quan trắc, text: { vi: "Mọi yêu cầu được theo vết; thông báo lỗi mang mã tra cứu để đối chiếu nhật ký; có số liệu đăng nhập, gửi OTP và thông báo đã gửi giữa các phân hệ." } }
  - { id: NFR-PERF-02, attr: Hiệu năng, text: { vi: "Một lượt hỏi agent của console trả lời trong 60 giây hoặc dừng và cho chạy nền, báo khi xong." } }
  - { id: NFR-PRIV-02, attr: Quyền riêng tư, text: { vi: "Mỗi lần agent của console đọc dữ liệu cá nhân được ghi lại kèm nhân viên đã hỏi; cuộc chat với agent giữ 180 ngày; xóa tài khoản thì xóa các phần trích dữ liệu của tài khoản đó." } }
  - { id: NFR-API-01, was: [NFR-09], attr: Tuân thủ hợp đồng API, text: { vi: "Mọi yêu cầu được kiểm theo đặc tả API; bộ kiểm thử đầu-cuối gặp đủ mọi kết quả trả về đã khai trong đặc tả." } }
  - { id: NFR-ARCH-01, was: [NFR-10], attr: Khả năng tách phân hệ, text: { vi: "Mỗi phân hệ chỉ cho phân hệ khác dùng qua giao diện đã công bố; tách ra chạy riêng không phải sửa nghiệp vụ." } }
  - { id: NFR-UX-01, was: [NFR-11], attr: Ứng dụng di động, text: { vi: "Ứng dụng chạy trên Android 12 trở lên, có giao diện tối, cỡ chữ 130%, vùng chạm tối thiểu 48 dp; website dùng được ở bề rộng điện thoại." } }

adr:
  - id: ADR-0001
    status: accepted
    title: { vi: "Sàn không giữ tiền, giao dịch bằng COD qua tài khoản hãng của người bán", en: "No money held; COD through the seller's own carrier account" }
    text: { vi: "Vận đơn được tạo trên tài khoản GHTK/GHN của chính người bán; tiền hàng do hãng thu hộ trả thẳng cho người bán. Sàn không có ví, không cọc, không hoàn tiền, nên cũng không phải phân xử ai được nhận tiền (BR-DEAL-01)." }
  - id: ADR-0002
    status: accepted
    title: { vi: "Quy trình nhiều bước chạy trên Restate", en: "Multi-step flows run on Restate" }
    text: { vi: "Mỗi quy trình gọi ra ngoài nhiều bước (giữ tin, tạo vận đơn, lưu đơn) là một service Restate: từng bước được ghi lại, máy chủ chết giữa chừng thì chạy tiếp từ bước đã xong, gọi lại cùng khóa thì trả kết quả lần đầu (NFR-DUR-01, NFR-IDEM-01)." }
  - id: ADR-0003
    status: accepted
    title: { vi: "Agent của console chạy riêng, đọc qua MCP của máy chủ", en: "The console agent runs apart and reads through the server's MCP" }
    text: { vi: "Vòng lặp agent là dịch vụ riêng (shopnexus/agent) trong mạng nội bộ; console chỉ gọi máy chủ, máy chủ kiểm phiên rồi chuyển tiếp. Agent lấy dữ liệu qua MCP của máy chủ, chỉ có công cụ đọc; mọi thao tác ghi đi qua các endpoint console có nhật ký (BR-MOD-03). Việc chạy nền do Restate của máy chủ gọi agent (ADR-0002)." }
