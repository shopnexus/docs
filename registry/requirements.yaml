      A2: { at: 2, text: "Người mua chấp nhận ngay giá niêm yết, không trả giá." }
      A3: { at: 4, text: "Sau khi chốt, một bên hủy chốt giá khi chưa có đơn: thương lượng quay lại bước 2." }
