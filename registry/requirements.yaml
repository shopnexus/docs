    main:
      1: "Người dùng chọn loại phiếu: báo chưa nhận hàng của một đơn, xin thêm một hãng vận chuyển, hoặc yêu cầu khác kèm tin nhắn đầu."
      2: "Hệ thống mở cuộc trò chuyện hỗ trợ với tài khoản ShopNexus, tạo phiếu đang mở và gửi tin nhắn đầu của người dùng."
      3: "Điều phối viên thấy phiếu trong hàng chờ của trang điều hành và đọc người gửi, đơn cùng cuộc trò chuyện."
      4: "Điều phối viên trả lời dưới tên ShopNexus; mỗi câu trả lời ghi tên nhân viên đã gửi."
      5: "Điều phối viên đánh dấu phiếu đã xử lý."
