    status: done
    title: { vi: "Nhắn tin theo tin đăng", en: "Chat about a listing" }
    actors: [user]
    fr: [FR-DEAL-01, FR-TRS-04]
    br: [BR-ACC-01, BR-ACC-03, BR-MOD-02]
    nfr: [NFR-IDEM-01]
    api: ["POST /v1/conversations", "POST /v1/conversations/{id}/messages", "POST /v1/conversations/{id}/read", "POST /v1/conversations/{id}/unread", "POST /v1/conversations/{id}/archive", "POST /v1/conversations/{id}/unarchive", "POST /v1/conversations/{id}/ignore", "POST /v1/conversations/{id}/unignore", "GET /v1/screens/inbox/search", "PUT /v1/me/quick-replies"]
    pre: Đã đăng nhập.
    post: Hai người có một cuộc trò chuyện chung; mọi phiên trả giá và mọi đơn giữa hai người hiện trong cuộc trò chuyện đó.
    main:
      1: Người dùng mở cuộc trò chuyện từ tin đăng của người khác và viết tin nhắn đầu.
      2: Hệ thống mở cuộc trò chuyện của hai người, hoặc dùng lại cuộc trò chuyện đã có, rồi gửi tin nhắn đầu.
      3: "Hai bên nhắn văn bản, ảnh, có thể trích một tin trước; mỗi lượt trả giá và mỗi bước của đơn hiện thành tin nhắn hệ thống."
      4: Bên kia nhận tin ngay và nhận thông báo đẩy (UC-SHR-03); khi bên kia đọc, hệ thống ghi đã đọc và người gửi thấy đã xem.
    alt:
      A1: { at: 3, text: "Tin có ảnh: tin ở trạng thái đang xử lý, chỉ người gửi thấy; ảnh xử lý xong thì tin được gửi, ảnh hỏng thì tin gửi không thành." }
      A2: { at: 3, text: "Ứng dụng gửi lại cùng một yêu cầu: chỉ một tin được gửi.", nfr: NFR-IDEM-01 }
      A3: { at: 4, text: "Người dùng lưu trữ, bỏ qua hoặc đánh dấu chưa đọc cuộc trò chuyện. Tin nhắn mới đưa cuộc trò chuyện đã lưu trữ về hộp thư; người bỏ qua tự viết thì hết bỏ qua. Bên kia không được báo." }
      A4: { at: 4, text: "Người dùng tìm trong hộp thư theo tên người, tiêu đề tin hoặc chữ trong tin nhắn." }
      A5: { at: 3, text: Người bán chèn một câu trả lời nhanh đã lưu vào ô soạn tin. }
      A6: { at: 4, text: "Tin nhắn có dấu hiệu lừa đảo: ứng dụng hiện cảnh báo lừa đảo trong cuộc trò chuyện; người dùng tắt được cảnh báo (FR-TRS-04)." }
    exc:
      E1: { at: 2, text: "Hai người đã chặn nhau: không mở được cuộc trò chuyện, không gửi được tin.", br: BR-ACC-01, error: blocked }
      E2: { at: 2, text: Người mở cuộc trò chuyện chưa có số điện thoại, br: BR-ACC-03, error: phone_required }
      E3: { at: 2, text: "Tài khoản đang bị tạm khóa; vẫn viết được trong phiếu hỗ trợ.", error: account_suspended }
      E4: { at: 2, text: Tin đăng của chính người dùng, error: own_listing }
      E5: { at: 2, text: Tin không còn đang bán, error: listing_unavailable }
      E6: { at: 3, text: Bên kia đã xóa tài khoản, error: account_deleted }
      E7: { at: 3, text: "Tin nhắn sai quy tắc: trống, quá 1.000 ký tự, quá 4 ảnh, gắn tin của người ngoài hoặc trích tin không hợp lệ.", error: invalid_message }
      E8: { at: 3, text: "Ảnh không phải của người gửi, chưa tải lên xong hoặc đã dùng: tin không được gửi.", error: invalid_upload }

