      3: Chốt giá bị bỏ, thương lượng quay lại đang thương lượng.
    alt:
      A1: { at: 1, text: "Người bán không gửi hàng trong 3 ngày: hệ thống tự hủy đơn." }
      A2: { at: 1, text: "Hãng chưa lấy hàng 3 ngày sau khi người bán gửi: hệ thống tự hủy đơn và hủy vận đơn trên tài khoản hãng." }
      A3: { at: 1, text: "Người bán gửi tin cho người mua khác, hoặc ẩn, xóa tin: các đơn chờ gửi trên tin tự hủy.", br: BR-DEAL-04 }
    exc:
      E1: { at: 1, text: Đơn đã gửi hàng, error: move_not_allowed }

