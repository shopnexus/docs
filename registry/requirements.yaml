# Nguồn duy nhất cho mã yêu cầu của ShopNexus.
#
# Báo cáo Typst (typst/common/req.typ) và web docs (web/src/lib/registry.ts)
# đọc thẳng file này. Code server chỉ trỏ tới mã; `make trace` ở repo gốc
# kiểm tra mã thiếu, thừa và lệch. Đổi mã bằng `make trace-rename`, không
# sửa tay.
#
# Quy ước:
# - UC-<NHÓM>-nn, FR-<NHÓM>-nn, BR-<NHÓM>-nn; NFR-<THUỘC TÍNH>-nn; ADR-nnnn.
# - Luồng trong UC: A1… là luồng thay thế (vẫn đạt mục tiêu), E1… là luồng
#   ngoại lệ (dừng, không đạt mục tiêu). `at` là bước của luồng chính nơi
#   luồng tách ra.
# - Số đã cấp không đổi, không dùng lại. Bỏ một mục hoặc một luồng thì đặt
#   `status: retired`.
# - `was` giữ mã cũ: `trace rename --from-was` dùng nó để đổi mã trong
#   tài liệu, và `trace check` báo lỗi khi còn chỗ dùng mã cũ.
# - status: untraced (chưa xét, chưa gắn tag) | planned | doing | done | retired.
# - `gaps` ghi chỗ code đang khác đặc tả, để cả báo cáo lẫn web cùng thấy.

groups:
  ACC: { vi: Tài khoản và định danh, en: Accounts and identity }
  LST: { vi: Đăng bán, en: Listings }
  DSC: { vi: Khám phá, en: Discovery }
  DEAL: { vi: Trao đổi và giao dịch, en: Chat and deals }
  TRS: { vi: Hậu giao dịch và uy tín, en: After the sale and trust }
  MOD: { vi: Vận hành, en: Operations }
  SHR: { vi: Ca dùng chung («include»), en: Shared use cases («include») }

actors:
  user: { vi: Người dùng, en: User }
  buyer: { vi: Người mua, en: Buyer }
  seller: { vi: Người bán, en: Seller }
  guest: { vi: Khách, en: Guest }
  carrier: { vi: Hãng vận chuyển, en: Carrier }
  moderator: { vi: Điều phối viên, en: Moderator }
  admin: { vi: Quản trị viên, en: Administrator }
  llm: { vi: Dịch vụ AI, en: AI service }
  sub: { vi: Ca con, en: Sub use case }

uc:
  # ---- ACC ----
  - id: UC-ACC-01
    was: [UC-01]
    status: done
    title: { vi: "Đăng nhập bằng số điện thoại, Google hoặc email (lần đầu tự tạo tài khoản)", en: "Sign in by phone, Google or email" }
    actors: [guest]
    fr: [FR-ACC-01]
    br: [BR-ACC-02, BR-ACC-05]
    nfr: [NFR-SEC-01, NFR-IDEM-01, NFR-DUR-01]
    api: ["POST /v1/auth/sign-in", "POST /v1/auth/email-codes"]
    pre: "Người dùng chưa đăng nhập trên thiết bị."
    post: "Thiết bị có một phiên đăng nhập; lần đầu thì có thêm tài khoản mới và ứng dụng mời người dùng điền hồ sơ (UC-ACC-06)."
    main:
      1: "Người dùng xác minh số điện thoại bằng mã OTP qua SMS (Firebase), hoặc chọn tài khoản Google, rồi gửi bằng chứng cho hệ thống."
      2: "Hệ thống kiểm tra bằng chứng và lấy ra số điện thoại hoặc email đã được chứng minh."
      3: "Hệ thống tìm tài khoản đang giữ số hoặc email đó và ghi nhận lần dùng; Google đăng nhập vào tài khoản đang giữ email của nó."
      4: "Hệ thống tạo phiên đăng nhập cho thiết bị và trả mã truy cập cùng mã làm mới."
    alt:
      A1: { at: 1, text: "Đăng nhập bằng email: hệ thống gửi mã OTP sáu số tới email, sống 5 phút, đoán tối đa 5 lần; người dùng nhập mã. Câu trả lời như nhau dù email đã có tài khoản hay chưa.", br: BR-ACC-02 }
      A2: { at: 3, text: "Chưa tài khoản nào giữ số hoặc email: hệ thống tạo tài khoản và phương thức đăng nhập trong một giao dịch." }
      A3: { at: 4, text: "Ứng dụng gửi lại yêu cầu với cùng khóa: hệ thống cấp mã mới cho phiên đã tạo, không tạo phiên thứ hai.", nfr: NFR-IDEM-01 }
      A4: { at: 3, text: "Tài khoản đang bị tạm khóa vẫn đăng nhập được; ứng dụng chỉ mở màn hình tạm khóa với lý do, ngày hết, nút gửi hỗ trợ và nút đăng xuất.", br: BR-MOD-02 }
    exc:
      E1: { at: 2, text: "Bằng chứng Firebase không hợp lệ, quá 5 phút, hoặc số không phải số di động Việt Nam", error: invalid_phone_token }
      E2: { at: 2, text: "Bằng chứng Google không hợp lệ hoặc quá 5 phút", error: invalid_google_token }
      E3: { at: 1, text: "Xin mã OTP mới khi chưa qua 45 giây kể từ mã trước", nfr: NFR-SEC-01, error: otp_too_soon }
      E4: { at: 1, text: "Quá 5 mã OTP một giờ cho một email, hoặc quá 20 mã một giờ từ một địa chỉ mạng", nfr: NFR-SEC-01, error: otp_limit }
      E5: { at: 1, text: "Dịch vụ thư từ chối hẳn địa chỉ email", error: invalid_email }
      E6: { at: 2, text: "Mã OTP sai; câu trả lời cho biết còn mấy lần đoán", error: invalid_code }
      E7: { at: 2, text: "Đoán sai quá 5 lần", error: code_locked }
      E8: { at: 2, text: "Mã OTP hết hạn, đã có mã mới hơn, hoặc là mã để thêm email vào tài khoản", error: code_expired }
      E9: { status: retired, at: 3, text: "Tài khoản đang bị tạm khóa. Đã bỏ: tài khoản bị tạm khóa vẫn đăng nhập được (A4)." }
      E10: { at: 3, text: "Một lượt đăng ký khác vừa giữ số hoặc email đó, hoặc tài khoản vừa bị xóa; người dùng thử lại (try_again)", br: BR-ACC-05 }
      E11: { at: 4, text: "Phiên của lần gửi đầu đã bị đăng xuất", error: session_revoked }
  - id: UC-ACC-02
    was: [UC-02]
    status: done
    title: { vi: "Quản lý phiên đăng nhập trên các thiết bị", en: "Manage sessions across devices" }
    actors: [user]
    fr: [FR-ACC-02]
    br: [BR-ACC-02, BR-ACC-04]
    nfr: [NFR-SEC-01]
    api: ["GET /v1/auth/sessions", "DELETE /v1/auth/sessions/current", "DELETE /v1/auth/sessions/others", "DELETE /v1/auth/sessions/{id}", "POST /v1/auth/refresh", "POST /v1/auth/sessions/current/reauthenticate"]
    pre: "Đã đăng nhập (UC-ACC-01)."
    post: "Phiên bị đăng xuất không làm mới được nữa; mã truy cập của nó còn dùng tới khi hết 15 phút."
    main:
      1: "Người dùng mở danh sách thiết bị đang đăng nhập, mới nhất trước; thiết bị đang dùng được đánh dấu."
      2: "Người dùng đăng xuất một thiết bị trong danh sách, hoặc đăng xuất thiết bị đang dùng."
      3: "Hệ thống thu hồi phiên đó."
    alt:
      A1: { at: 2, text: "Người dùng đăng xuất mọi thiết bị khác cùng lúc.", br: BR-ACC-04 }
      A2: { at: 2, text: "Lần đăng nhập đã quá 15 phút: người dùng xác nhận lại bằng mã OTP qua SMS, Google hoặc mã OTP gửi email của chính tài khoản; hệ thống dời thời điểm đăng nhập của phiên và cấp mã truy cập mới, giữ nguyên mã làm mới.", br: BR-ACC-04 }
      A3: { at: 1, text: "Mã truy cập hết hạn sau 15 phút: ứng dụng làm mới phiên; hệ thống thay mã làm mới và cấp mã truy cập mới.", nfr: NFR-SEC-01 }
      A4: { at: 1, text: "Tài khoản đang bị tạm khóa vẫn làm mới phiên như mọi tài khoản khác; việc tạm khóa không đăng xuất thiết bị nào.", br: BR-MOD-02 }
    exc:
      E1: { at: 2, text: "Phiên không có hoặc thuộc tài khoản khác", br: BR-ACC-02, error: session_not_found }
      E2: { at: 2, text: "Đăng xuất thiết bị khác khi lần đăng nhập đã quá 15 phút", br: BR-ACC-04, error: reauth_required }
      E3: { at: 2, text: "Bằng chứng xác nhận lại thuộc tài khoản khác hoặc chưa thuộc tài khoản nào", br: BR-ACC-02, error: wrong_account }
      E4: { at: 1, text: "Mã làm mới không có trong hệ thống", error: invalid_refresh_token }
      E5: { at: 1, text: "Mã làm mới đã thay bị dùng lại hoặc hai lần làm mới tranh nhau (hệ thống thu hồi phiên), phiên đã đăng xuất, hoặc tài khoản đã xóa", nfr: NFR-SEC-01, error: session_revoked }
      E6: { at: 1, text: "Phiên đã quá 60 ngày kể từ lúc đăng nhập hoặc 30 ngày không dùng", error: session_expired }
      E7: { status: retired, at: 1, text: "Tài khoản đang bị tạm khóa; hệ thống thu hồi phiên. Đã bỏ: phiên vẫn làm mới được (A4)." }
  - id: UC-ACC-03
    was: [UC-03]
    status: retired
    title: { vi: "Xác minh danh tính điện tử (CCCD gắn chip và khuôn mặt)", en: "Verify identity (chip ID card and face)" }
    actors: [user]
  - id: UC-ACC-04
    was: [UC-04]
    status: done
    title: { vi: "Thiết lập giao COD (liên kết tài khoản GHTK/GHN, địa chỉ lấy hàng)", en: "Set up COD (GHTK/GHN link, pickup address)" }
    actors: [seller, carrier]
    fr: [FR-ACC-05]
    br: [BR-DEAL-05]
    nfr: [NFR-PRIV-01]
    api: ["GET /v1/carrier-accounts", "PUT /v1/carrier-accounts/{carrier}", "DELETE /v1/carrier-accounts/{carrier}", "POST /v1/carrier-accounts/{carrier}/otp", "PUT /v1/me/shipping-settings"]
    pre: "Đã đăng nhập; người bán đã có tài khoản ở GHTK hoặc GHN."
    post: "Người bán có tài khoản hãng đã liên kết và địa chỉ lấy hàng đã lưu, nên gửi được đơn COD (UC-DEAL-04)."
    main:
      1: "Người bán mở thiết lập giao hàng; hệ thống cho biết hãng nào đã liên kết và hãng nào liên kết được."
      2: "Người bán chọn hãng và nhập tài khoản sẵn có ở hãng: GHTK bằng email và mật khẩu, GHN bằng token và ShopId."
      3: "Hệ thống kiểm tra với hãng, giữ token đã mã hóa và thay tài khoản đã liên kết trước đó ở hãng này. Hệ thống không lưu mật khẩu."
      4: "Người bán chọn một địa chỉ trong sổ địa chỉ và số điện thoại liên hệ làm địa chỉ lấy hàng đã lưu."
    alt:
      A1: { at: 2, text: "GHN bằng số điện thoại: GHN nhắn mã OTP tới số đó, người bán nhập mã; GHN tạo cửa hàng mới hoặc dùng lại cửa hàng đã nhận hệ thống làm nhân viên, và hệ thống không giữ token." }
      A2: { at: 1, text: "Người bán gỡ liên kết một hãng." }
    exc:
      E1: { at: 3, text: "Hãng từ chối tài khoản: sai email, mật khẩu, token hoặc ShopId", error: carrier_login_failed }
      E2: { at: 2, text: "Số không phải số di động hoặc chưa có tài khoản GHN", error: carrier_phone_unknown }
      E3: { at: 3, text: "Mã OTP của GHN sai hoặc hết hạn", error: carrier_otp_invalid }
      E4: { at: 3, text: "Đổi sang cửa hàng khác hoặc gỡ liên kết khi còn đơn đang giao qua hãng đó", error: shipments_open }
      E5: { at: 2, text: "Hệ thống đang tắt hãng này", error: carrier_unavailable }
      E6: { at: 4, text: "Địa chỉ không thuộc người bán", br: BR-ACC-02, error: address_not_found }
      E7: { at: 4, text: "Số điện thoại liên hệ không phải số di động Việt Nam", error: invalid_shipping_settings }
      E8: { at: 1, text: "Gỡ liên kết một hãng chưa liên kết", error: carrier_account_not_found }
  - id: UC-ACC-05
    was: [UC-05]
    status: done
    title: { vi: "Chặn người dùng khác", en: "Block another user" }
    actors: [user]
    fr: [FR-ACC-06]
    br: [BR-ACC-01]
    api: ["POST /v1/blocks", "GET /v1/blocks", "DELETE /v1/blocks/{account_id}"]
    pre: "Đã đăng nhập."
    post: "Lệnh chặn có hiệu lực hai chiều theo BR-ACC-01."
    main:
      1: "Người dùng chọn chặn một người từ cuộc trò chuyện hoặc trang người bán."
      2: "Hệ thống ghi lệnh chặn và xóa lượt theo dõi giữa hai người theo cả hai chiều."
      3: "Cuộc trò chuyện với người đó rời khỏi hộp thư của người chặn; tin đăng của hai bên không hiện khi người kia tìm kiếm."
    alt:
      A1: { at: 2, text: "Đã chặn người đó từ trước: hệ thống không đổi gì." }
      A2: { at: 1, text: "Người dùng xem danh sách người mình chặn và bỏ chặn; lượt theo dõi đã xóa không trở lại." }
    exc:
      E1: { at: 1, text: "Tự chặn chính mình", error: invalid_block }
      E2: { at: 1, text: "Chặn tài khoản hệ thống", error: account_is_system }
      E3: { at: 1, text: "Người kia đã xóa tài khoản", error: account_deleted }
      E4: { at: 1, text: "Không có tài khoản đó", error: account_not_found }
  - id: UC-ACC-06
    status: done
    title: { vi: "Sửa hồ sơ và bật chế độ vắng mặt", en: "Edit the profile and set away mode" }
    actors: [user]
    fr: [FR-ACC-03]
    nfr: [NFR-CONC-01]
    api: ["GET /v1/accounts/me", "PATCH /v1/accounts/me"]
    pre: "Đã đăng nhập."
    post: "Người khác thấy hồ sơ mới ở mọi nơi hiện người dùng; khi đang vắng mặt, mọi nơi đó báo người dùng đang vắng."
    main:
      1: "Người dùng mở hồ sơ của mình: tên hiển thị, giới thiệu, ảnh đại diện và các phương thức đăng nhập."
      2: "Người dùng sửa tên hiển thị, phần giới thiệu (tối đa 200 ký tự, công khai) hoặc ảnh đại diện."
      3: "Hệ thống kiểm tra, cắt ảnh đại diện thành hình vuông, lưu và báo cho các module khác."
    alt:
      A1: { at: 2, text: "Người dùng bật chế độ vắng mặt tới một ngày trong 30 ngày tới, hoặc tắt nó. Khi đang vắng, người mua không trả giá, chấp nhận giá hay yêu cầu COD trên tin của người dùng; tin vẫn hiện khi tìm kiếm." }
      A2: { at: 2, text: "Người dùng gỡ ảnh đại diện." }
    exc:
      E1: { at: 3, text: "Tên, giới thiệu hoặc ngày hết vắng mặt sai quy tắc; câu trả lời nêu từng ô sai", error: invalid_account }
      E2: { at: 3, text: "Ảnh đại diện không đọc được hoặc không phải ảnh người dùng tải lên", error: invalid_upload }
      E3: { at: 2, text: "Tài khoản đang bị tạm khóa", error: account_suspended }
      E4: { at: 3, text: "Một lần sửa khác vừa lưu trước (try_again)", nfr: NFR-CONC-01 }
  - id: UC-ACC-07
    status: done
    title: { vi: "Quản lý sổ địa chỉ", en: "Manage the address book" }
    actors: [user]
    fr: [FR-ACC-07]
    br: [BR-ACC-02]
    nfr: [NFR-IDEM-01, NFR-CONC-01]
    api: ["GET /v1/addresses", "POST /v1/addresses", "PUT /v1/addresses/{id}", "DELETE /v1/addresses/{id}", "POST /v1/addresses/{id}/default"]
    pre: "Đã đăng nhập."
    post: "Sổ địa chỉ có tối đa 10 địa chỉ và đúng một địa chỉ mặc định; người mua chọn địa chỉ nhận khi yêu cầu COD (UC-DEAL-03), người bán chọn địa chỉ lấy hàng (UC-ACC-04)."
    main:
      1: "Người dùng mở sổ địa chỉ; địa chỉ mặc định đứng đầu, rồi tới địa chỉ mới nhất."
      2: "Người dùng thêm địa chỉ: tên người nhận, số di động Việt Nam, số nhà và đường, phường/xã, loại địa chỉ (nhà riêng, cơ quan, khác)."
      3: "Hệ thống kiểm tra và lưu; địa chỉ đầu tiên thành mặc định."
    alt:
      A1: { at: 2, text: "Người dùng sửa một địa chỉ." }
      A2: { at: 2, text: "Người dùng chọn một địa chỉ làm mặc định, khi thêm, khi sửa hoặc từ danh sách; địa chỉ mặc định cũ thôi là mặc định." }
      A3: { at: 2, text: "Người dùng xóa một địa chỉ; nếu đó là địa chỉ mặc định, địa chỉ mới nhất còn lại thành mặc định. Đơn COD đã tạo giữ bản sao địa chỉ riêng." }
      A4: { at: 3, text: "Ứng dụng gửi lại yêu cầu thêm với cùng khóa: hệ thống trả địa chỉ của lần đầu, kể cả khi sổ đã đủ 10.", nfr: NFR-IDEM-01 }
    exc:
      E1: { at: 3, text: "Thông tin sai quy tắc, ví dụ số điện thoại sai hoặc phường/xã không có; câu trả lời nêu từng ô sai", error: invalid_address }
      E2: { at: 3, text: "Sổ đã có 10 địa chỉ", error: address_limit_reached }
      E3: { at: 2, text: "Địa chỉ không thuộc người dùng", br: BR-ACC-02, error: address_not_found }
      E4: { at: 3, text: "Một thay đổi khác vừa lưu trước lần sửa (try_again)", nfr: NFR-CONC-01 }
  - id: UC-ACC-08
    status: done
    title: { vi: "Thêm số điện thoại hoặc email vào tài khoản", en: "Add a phone number or an email to the account" }
    actors: [user]
