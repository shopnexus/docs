      A3: { at: 1, text: "Người bán gửi hàng cho người mua khác, hoặc tin bị ẩn, bán ngoài ứng dụng hay bị xóa: các đơn chờ tạo đơn trên tin tự hủy.", br: BR-DEAL-04 }
