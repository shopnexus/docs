      E2: { at: 1, text: "Đơn không có hoặc người dùng không phải người mua", error: order_not_found }
      E3: { at: 1, text: "Đơn chưa gửi, hoặc đã hoàn tất mà không phải hệ thống tự hoàn tất trong 7 ngày qua", error: ticket_not_allowed }
      E4: { at: 1, text: "Phiếu sai giới hạn: thiếu đơn, tên hãng ngoài 1 đến 50 ký tự hoặc yêu cầu khác không có tin nhắn", error: invalid_ticket }
      E5: { at: 2, text: "Tin nhắn đầu bị từ chối (ví dụ ảnh không phải của người dùng): phiếu và cuộc trò chuyện bị bỏ." }
